    h+='<div class="section-title">掉落 drops <span class="r">概率按每条独立 roll</span></div>';
    h+=renderDropTable(item);
    h+='<div class="drop-actions"><button type="button" class="mini" data-add-drop="1">＋ 添加掉落</button>'
      +'<span class="tagline">chance 是 0~100%；min/max 是数量闭区间。</span></div>';
    h+=renderDropCheck(item);
    h+=renderGroups(item);

    detail.innerHTML=h;

    const lvInput=document.getElementById('mPreviewLv');
    if(lvInput){
      lvInput.addEventListener('input',function(){
        const v=Number(lvInput.value);
        previewPlayerLv=(isFinite(v)&&v>=1)?Math.floor(v):1;
        const box=document.getElementById('mExpPreview'); if(box) box.outerHTML=renderExpPreview(item);
      });
      lvInput.addEventListener('change',function(){ lvInput.value=previewPlayerLv; });
    }
    detail.querySelectorAll('[data-drop]').forEach(function(el){ el.addEventListener('input',onDropEdit); el.addEventListener('change',onDropEdit); });
  }

  function onDropEdit(e){
    const el=e.target, f=el.dataset.drop; if(!f) return;
    const item=currentItem(); if(!item) return;
    const i=Number(el.dataset.idx), d=item.drops[i]; if(!d) return;
    if(f==='itemId'){
      d.itemId=String(el.value).trim();
      if(e.type==='change'){ save(); renderList(); renderDetail(); } else save();
      return;
    }
    let v=el.value===''?0:Number(el.value); if(!isFinite(v)) v=0;
    if(f==='chance'){ v=Math.max(0,Math.min(100,v)); d.chance=+(v/100).toFixed(6); }
    else if(f==='min'){ v=Math.max(1,Math.floor(v)); d.min=v; if(d.max<d.min) d.max=d.min; }
    else if(f==='max'){ v=Math.max(1,Math.floor(v)); d.max=Math.max(v,d.min); }
    save();
    const cp=document.getElementById('mDropCheck'); if(cp) cp.outerHTML=renderDropCheck(item);
    if(f==='min'||f==='max'){
      const row=el.closest('tr');
      if(row){
        const mi=row.querySelector('[data-drop="min"]'), ma=row.querySelector('[data-drop="max"]');
        if(mi) mi.value=d.min; if(ma) ma.value=d.max;
      }
    }
  }

  function onEdit(e){
    const el=e.target, item=currentItem(); if(!item) return;

    /* 技能选择 */
    if(el.dataset.mSkillIdx!==undefined){
      const i=Number(el.dataset.mSkillIdx);
      item.skills[i]=String(el.value).trim();
      if(e.type==='change'){ item.skills=item.skills.filter(Boolean); save(); renderList(); renderDetail(); }
      else save();
      return;
    }

    if(el.dataset.root){
      const k=el.dataset.root;
      if(k==='key'){
        if(e.type!=='change') return;
        const nv=String(el.value).trim();
        if(!nv){ el.value=item.key; return; }
        if(nv===item.key) return;
        if(data.some(function(d){ return d!==item&&d.key===nv; })){ alert('Key 已存在：'+nv); el.value=item.key; return; }
        item.key=nv; if(!item._id||item._id===selectedKey) item._id=nv;
        selectedKey=nv; renderList(); renderDetail(); save(); return;
      }
      if(k==='_debugSample'){ item._debugSample=el.checked; renderDetail(); renderList(); save(); return; }
      if(k==='damageType'||k==='attackType'){ item[k]=el.value; renderList(); renderDetail(); save(); return; }
      item[k]=el.value; renderList(); save(); return;
    }

    if(el.dataset.num){
      const k=el.dataset.num;
      let v=el.value===''?0:Number(el.value); if(!isFinite(v)) v=0;
      if(k==='lv'||k==='HP'||k==='SPD') v=Math.max(1,Math.floor(v));
      if(k==='expBase'||k==='MP'||k==='MGA'||k==='MGD'||k==='STR'||k==='DEF'||k==='LUK') v=Math.max(0,Math.floor(v));
      item[k]=v;
      if(k==='CRT'||k==='LUK'||k==='T_CRT') refreshDerived(item);
      if(k==='lv'||k==='expBase'){ const box=document.getElementById('mExpPreview'); if(box) box.outerHTML=renderExpPreview(item); }
      renderList(); save(); return;
    }

    /* 物品组 */
    if(el.dataset.gidx!==undefined){
      const gi=Number(el.dataset.gidx), g=item.dropGroups[gi]; if(!g) return;
      if(el.dataset.gname!==undefined){ g.name=el.value; save(); return; }
      if(el.dataset.gchance!==undefined){
        let v=el.value===''?0:Number(el.value); if(!isFinite(v)) v=0;
        v=Math.max(0,Math.min(100,v)); v=Math.round(v*1000)/1000; g.chance=v/100;
        save(); refreshPanel('mGroupCheck',renderGroupCheck(item)); return;
      }
      if(el.dataset.gmode!==undefined){ g.mode=el.value==='one'?'one':'all'; save(); renderDetail(); return; }
      if(el.dataset.gitem){
        const ii=Number(el.dataset.iidx), it=g.items[ii]; if(!it) return;
        const f=el.dataset.gitem;
        if(f==='itemId'){ it.itemId=String(el.value).trim(); if(e.type==='change'){ save(); renderList(); renderDetail(); } else save(); return; }
        let v=el.value===''?0:Number(el.value); if(!isFinite(v)) v=0;
        if(f==='min'){ v=Math.max(1,Math.floor(v)); it.min=v; if(it.max<it.min) it.max=it.min; }
        else if(f==='max'){ v=Math.max(1,Math.floor(v)); it.max=Math.max(v,it.min); }
        else if(f==='weight'){ it.weight=Math.max(0,v); }
        save(); refreshPanel('mGroupCheck',renderGroupCheck(item));
        const row=el.closest('tr');
        if(row&&(f==='min'||f==='max')){
          const mi=row.querySelector('[data-gitem="min"]'),ma=row.querySelector('[data-gitem="max"]');
          if(mi) mi.value=it.min; if(ma) ma.value=it.max;
        }
      }
    }
  }
  function refreshPanel(id,html){ const cp=document.getElementById(id); if(cp) cp.outerHTML=html; }

  detail.addEventListener('input',onEdit);
  detail.addEventListener('change',onEdit);
  detail.addEventListener('click',function(e){
    const item=currentItem(); if(!item) return;
    if(e.target.closest('[data-recalc]')){ item.T_CRT=+(nz(item.CRT)*nz(item.LUK)*0.01).toFixed(4); renderDetail(); renderList(); save(); return; }
    if(e.target.closest('[data-add-drop]')){ item.drops.push({itemId:'',chance:1,min:1,max:1}); save(); renderList(); renderDetail(); return; }
    const dd=e.target.closest('[data-del-drop]');
    if(dd){ const i=Number(dd.dataset.delDrop); if(i>=0&&i<item.drops.length) item.drops.splice(i,1); save(); renderList(); renderDetail(); return; }
    if(e.target.closest('[data-add-group]')){
      item.dropGroups.push({name:'',chance:0.05,mode:'all',items:[{itemId:'',min:1,max:1,weight:1}]});
      save(); renderList(); renderDetail(); return;
    }
    const dg=e.target.closest('[data-del-group]');
    if(dg){ item.dropGroups.splice(Number(dg.dataset.delGroup),1); save(); renderList(); renderDetail(); return; }
    const ai=e.target.closest('[data-add-gitem]');
    if(ai){ const g=item.dropGroups[Number(ai.dataset.addGitem)]; if(g){ g.items.push({itemId:'',min:1,max:1,weight:1}); save(); renderDetail(); } return; }
    const di=e.target.closest('[data-del-gitem]');
    if(di){ const g=item.dropGroups[Number(di.dataset.gidx)]; if(g){ g.items.splice(Number(di.dataset.iidx),1); save(); renderDetail(); } return; }
    /* 技能增删 */
    if(e.target.closest('[data-m-skill-add]')){ item.skills.push(''); save(); renderDetail(); return; }
    const sd=e.target.closest('[data-m-skill-del]');
    if(sd){ item.skills.splice(Number(sd.dataset.mSkillDel),1); save(); renderList(); renderDetail(); return; }
  });

  function nextKey(){
    let max=0;
    data.forEach(function(d){ const m=String(d.key).match(/^m(\d+)$/); if(m) max=Math.max(max,parseInt(m[1],10)); });
    return 'm'+(max+1);
  }
  document.getElementById('mAddBtn').onclick=function(){
    const key=nextKey();
    data.push(normalizeEntry(key,{_id:key,_name:'新怪物',_debugSample:false,lv:1,expBase:100,HP:10,MP:0,STR:10,DEF:10,MGA:0,MGD:0,
      SPD:80,CRT:1.0001,T_CRT:1.0001,LUK:10,GP:1,Cont:0,damageType:'physical',attackType:'normal',skills:[],drops:[]}));
    selectedKey=key; renderList(); renderDetail(); save();
  };
  document.getElementById('mDupBtn').onclick=function(){
    const src=currentItem(); if(!src) return;
    const copy=JSON.parse(JSON.stringify(src));
    copy.key=nextKey(); copy._id=copy.key; copy._name=(copy._name||'')+'_副本'; copy._debugSample=false;
    data.push(copy); selectedKey=copy.key; renderList(); renderDetail(); save();
  };
  document.getElementById('mDelBtn').onclick=function(){
    if(!selectedKey) return;
    if(!confirm('确认删除 '+selectedKey+' ?')) return;
    const idx=data.findIndex(function(d){ return d.key===selectedKey; }); if(idx<0) return;
    data.splice(idx,1);
    selectedKey=data.length?data[Math.min(idx,data.length-1)].key:null;
    renderList(); renderDetail(); save();
  };

  const importFile=document.getElementById('mImportFile');
  document.getElementById('mImportBtn').onclick=function(){ importFile.click(); };
  pickFile(importFile,function(obj){
    if(Array.isArray(obj)) data=obj.map(function(x,i){ return normalizeEntry(x.key!=null?x.key:('m'+(i+1)),x); });
    else if(obj&&typeof obj==='object') data=Object.keys(obj).map(function(k){ return normalizeEntry(k,obj[k]); });
    else throw new Error('根节点必须是对象或数组');
    selectedKey=data.length?data[0].key:null;
    renderList(); renderDetail(); save();
    alert('已导入 '+data.length+' 条怪物。');
  });
  document.getElementById('mLoadItemsBtn').onclick=function(){ document.getElementById('mItemsFile').click(); };
  pickFile(document.getElementById('mItemsFile'),applyItemsTable);
  clearItemsBtn.onclick=clearItemsTable;
  document.getElementById('mRevalidateBtn').onclick=function(){ renderList(); renderDetail(); };

  function buildEntry(d){
    const out={};
    ENTRY_ORDER.forEach(function(k){
      if(k==='_debugSample'){ if(d._debugSample) out[k]=true; return; }
      if(k==='skills'){ const s=(d.skills||[]).filter(Boolean); if(s.length) out[k]=s.slice(); return; }
      if(k==='drops'){
        const drops=Array.isArray(d.drops)?d.drops:[]; if(!drops.length) return;
        out[k]=drops.map(function(x){ return {itemId:x.itemId,chance:Number(nz(x.chance).toFixed(6)),min:x.min,max:x.max}; });
        return;
      }
      if(k==='dropGroups'){
        const gs=Array.isArray(d.dropGroups)?d.dropGroups:[]; if(!gs.length) return;
        out[k]=gs.map(function(g){ return {name:g.name||'',chance:Number(nz(g.chance).toFixed(6)),mode:g.mode==='one'?'one':'all',
          items:(g.items||[]).map(function(x){ return {itemId:x.itemId,min:x.min,max:x.max,weight:Number(x.weight)}; })}; });
        return;
      }
      if(d[k]!==undefined&&d[k]!==null) out[k]=d[k];
    });
    Object.keys(d).forEach(function(k){
      if(!(k in out)&&k!=='key'&&k!=='drops'&&k!=='dropGroups'&&k!=='skills') out[k]=d[k];
    });
    return out;
  }
  function buildJSONText(){
    return '{\n'+data.map(function(d){
      return '  '+JSON.stringify(d.key)+': '+indentBlock(JSON.stringify(buildEntry(d),null,2),1);
    }).join(',\n')+'\n}';
  }
  document.getElementById('mExportBtn').onclick=function(){ download('monsters.json',buildJSONText()); };

  /* 筛选事件 */
  searchInput.addEventListener('input',renderList);
  fLvMin.addEventListener('input',renderList);
  fLvMax.addEventListener('input',renderList);
  fDamageType.addEventListener('change',renderList);
  fAttackType.addEventListener('change',renderList);
  document.querySelectorAll('[data-mtri]').forEach(function(btn){
    const st={key:btn.dataset.mtri,state:'all',btn:btn}; triStates.push(st);
    btn.addEventListener('click',function(){
      st.state=st.state==='all'?'on':(st.state==='on'?'off':'all');
      btn.dataset.state=st.state;
      btn.querySelector('.tri-val').textContent=st.state==='all'?'全部':(st.state==='on'?'是':'否');
      renderList();
    });
  });
  document.getElementById('mResetFilter').onclick=function(){
    searchInput.value=''; fLvMin.value=''; fLvMax.value=''; fDamageType.value=''; fAttackType.value='';
    triStates.forEach(function(t){ t.state='all'; t.btn.dataset.state='all'; t.btn.querySelector('.tri-val').textContent='全部'; });
    renderList();
  };

  (function init(){
    fillFilters();
    const parsed=loadLS(LS_KEY);
    data=Array.isArray(parsed)&&parsed.length?parsed.map(function(d){ return normalizeEntry(d.key,d); }):defaultData();
    selectedKey=data.length?data[0].key:null;
    renderList(); renderDetail();
  })();

  return {
    renderList:renderList, renderDetail:renderDetail,
    onShow:function(){ renderList(); renderDetail(); },
    exportJSON:function(){ download('monsters.json',buildJSONText()); },
    count:function(){ return data.length; }
  };
})();

/* =========================================================
   SECTION: 玩家模块
   ========================================================= */
MODULES.players=(function(){
  const LS_KEY='players_editor_skeleton_v2';
  const NUM_FIELDS=[
    {k:'lv',label:'lv 等级',step:1,min:1,hint:'≥ 1'},
    {k:'HP',label:'HP 生命值',step:1,min:1,hint:'≥ 1'},
    {k:'MP',label:'MP 魔力值',step:1,min:0,hint:'≥ 0'},
    {k:'STR',label:'STR 物理攻击',step:1,min:0,hint:'≥ 0'},
    {k:'DEF',label:'DEF 物理防御',step:1,min:0,hint:'≥ 0'},
    {k:'MGA',label:'MGA 魔法攻击',step:1,min:0,hint:'≥ 0'},
    {k:'MGD',label:'MGD 魔法防御',step:1,min:0,hint:'≥ 0'},
    {k:'SPD',label:'SPD 速度',step:1,min:1,hint:'秒/次 = 100 / SPD'},
    {k:'CRT',label:'CRT 暴击基数',step:0.0001,min:0,hint:'派生用'},
    {k:'T_CRT',label:'T_CRT 真暴击率',step:0.0001,min:0,hint:'= CRT × LUK × 0.01'},
    {k:'LUK',label:'LUK 幸运',step:1,min:0,hint:'≥ 0'},
    {k:'GP',label:'GP 成长力',step:0.1,min:0,hint:'不参与战斗结算'},
    {k:'Cont',label:'Cont 控制抗性',step:0.1,min:0,hint:'0.5 = 0.5%'}
  ];
  const EQUIP_SLOTS=['head','ear','chest','hands','legs','feet','weapon1','weapon2','bag'];
  const ENTRY_ORDER=['_id','_name','_debugSample','lv','HP','MP','STR','DEF','MGA','MGD','SPD','CRT','T_CRT','LUK','GP','Cont',
    'skills','startGoldCopper','startEquipment','startItems','storage'];

  let data=[],selectedKey=null,itemsIndex=null;
  const listBody=document.getElementById('pListBody'), detail=document.getElementById('pDetail'),
    statEl=document.getElementById('pStat'), searchInput=document.getElementById('pSearch'),
    fLvMin=document.getElementById('pLvMin'), fLvMax=document.getElementById('pLvMax'),
    itemsStatus=document.getElementById('pItemsStatus'), clearItemsBtn=document.getElementById('pClearItemsBtn'),
    itemList=document.getElementById('pItemList');
  const triStates=[];

  function normSkillList(v){
    if(!Array.isArray(v)) return [];
    return v.map(function(x){
      if(x==null) return '';
      if(typeof x==='object') return String(x.skillId!=null?x.skillId:(x.key!=null?x.key:(x.id!=null?x.id:''))).trim();
      return String(x).trim();
    }).filter(Boolean);
  }
  function normalizeEntry(key,obj){
    obj=obj||{};
    const rawEq=(obj.startEquipment&&typeof obj.startEquipment==='object'&&!Array.isArray(obj.startEquipment))?obj.startEquipment:{};
    const startEquipment={};
    EQUIP_SLOTS.forEach(function(slot){
      const v=rawEq[slot]!=null?String(rawEq[slot]).trim():''; if(v) startEquipment[slot]=v;
    });
    for(const slot in rawEq){
      if(EQUIP_SLOTS.indexOf(slot)!==-1) continue;
      const v=rawEq[slot]!=null?String(rawEq[slot]).trim():''; if(v) startEquipment[slot]=v;
    }
    const startItems=[];
    (Array.isArray(obj.startItems)?obj.startItems:[]).forEach(function(it){
      if(!it||typeof it!=='object') return;
      const itemId=it.itemId!=null?String(it.itemId).trim():''; if(!itemId) return;
      startItems.push({itemId:itemId,qty:Math.max(1,Math.floor(num(it.qty,1)))});
    });
    const rawSt=(obj.storage&&typeof obj.storage==='object'&&!Array.isArray(obj.storage))?obj.storage:{};
    const storage={};
    const ir=Number(rawSt.initRows);
    if(isFinite(ir)&&ir>=1) storage.initRows=Math.floor(ir);

    const out={
      key:String(key),
      _id:obj._id!=null?String(obj._id):String(key),
      _name:obj._name!=null?String(obj._name):'',
      _debugSample:!!obj._debugSample,
      lv:Math.max(1,Math.floor(num(obj.lv,1))),
      HP:Math.max(1,Math.floor(num(obj.HP,100))),
      MP:Math.max(0,Math.floor(num(obj.MP,100))),
      STR:Math.max(0,Math.floor(num(obj.STR,100))),
      DEF:Math.max(0,Math.floor(num(obj.DEF,100))),
      MGA:Math.max(0,Math.floor(num(obj.MGA,100))),
      MGD:Math.max(0,Math.floor(num(obj.MGD,100))),
      SPD:Math.max(1,Math.floor(num(obj.SPD,100))),
      CRT:Math.max(0,num(obj.CRT,1.001)),
      T_CRT:Math.max(0,num(obj.T_CRT,1.001)),
      LUK:Math.max(0,Math.floor(num(obj.LUK,100))),
      GP:Math.max(0,num(obj.GP,1)),
      Cont:Math.max(0,num(obj.Cont,0.5)),
      skills:normSkillList(obj.skills),
      startGoldCopper:Math.max(0,Math.floor(num(obj.startGoldCopper,0))),
      startEquipment:startEquipment,
      startItems:startItems,
      storage:storage
    };
    Object.keys(obj).forEach(function(k){ if(!(k in out)) out[k]=obj[k]; });
    return out;
  }
  function defaultData(){
    return [normalizeEntry('p1',{
      _id:'p1',_name:'战士',_debugSample:true,
      lv:1,HP:100,MP:100,STR:100,DEF:100,MGA:100,MGD:100,SPD:100,CRT:1.001,T_CRT:1.001,LUK:100,GP:1,Cont:0.5,
      skills:['s1','s2'],startGoldCopper:10000,
      startEquipment:{bag:'300100',weapon1:'300001',head:'300101'},
      startItems:[{itemId:'100001',qty:5},{itemId:'100010',qty:3}],
      storage:{initRows:28}})];
  }
  function save(){ saveLS(LS_KEY,data); REG.counts.players=data.length; updateGlobalStat(); }
  function currentItem(){ return data.find(function(d){ return d.key===selectedKey; })||null; }

  function hasItemsData(){ return itemsIndex!==null; }
  function itemsExists(id){ return !hasItemsData()||!!itemsIndex[id]; }
  function itemName(id){
    if(!hasItemsData()) return '';
    const it=itemsIndex[id]; if(!it) return '';
    return (it._props&&it._props.Name)||it._name||id;
  }
  function renderItemDatalist(){
    if(!hasItemsData()){ itemList.innerHTML=''; return; }
    itemList.innerHTML=Object.keys(itemsIndex).map(function(id){
      return '<option value="'+esc(id)+'">'+esc(itemName(id))+'</option>';
    }).join('');
  }
  function applyItemsTable(raw){
    if(!raw||typeof raw!=='object'||Array.isArray(raw)){ alert('items.json 根节点必须是对象'); return; }
    itemsIndex=raw;
    itemsStatus.textContent='已加载 '+Object.keys(raw).length+' 条 items'; itemsStatus.className='ok';
    clearItemsBtn.disabled=false; renderItemDatalist(); renderList(); renderDetail();
  }
  function clearItemsTable(){
    itemsIndex=null; itemsStatus.textContent='未加载'; itemsStatus.className='hint';
    clearItemsBtn.disabled=true; renderItemDatalist(); renderList(); renderDetail();
  }

  function visibleRows(){
    const q=searchInput.value.trim().toLowerCase();
    const lvMin=fLvMin.value===''?-Infinity:Number(fLvMin.value);
    const lvMax=fLvMax.value===''?Infinity:Number(fLvMax.value);
    return data.filter(function(d){
      if(q&&[d.key,d._id,d._name,(d.skills||[]).join(' ')].join(' ').toLowerCase().indexOf(q)===-1) return false;
      if(d.lv<lvMin||d.lv>lvMax) return false;
      for(let i=0;i<triStates.length;i++){
        const t=triStates[i]; if(t.state==='all') continue;
        const v=t.key==='_hasSkill'?!!(d.skills&&d.skills.length):!!d[t.key];
        if(t.state==='on'&&!v) return false;
        if(t.state==='off'&&v) return false;
      }
      return true;
    });
  }
  function eqCount(d){ return Object.keys(d.startEquipment||{}).length; }
  function eqTitle(d){
    const eq=d.startEquipment||{};
    const parts=Object.keys(eq).map(function(k){ return k+'='+eq[k]; });
    return parts.length?parts.join('\n'):'无初始装备';
  }
  function renderList(){
    const rows=visibleRows();
    listBody.innerHTML=rows.map(function(d){
      const nEq=eqCount(d), nIt=(d.startItems||[]).length, sk=(d.skills||[]).length;
      return '<tr data-key="'+esc(d.key)+'" draggable="true" class="'+(d.key===selectedKey?'selected':'')+'">'
        +'<td class="drag">⠿</td><td class="dim">'+esc(d.key)+'</td><td class="dim">'+esc(d._id)+'</td>'
        +'<td>'+esc(d._name||'')+'</td><td><span class="lv-pill">'+d.lv+'</span></td>'
        +'<td class="num">'+d.HP+'</td><td class="num">'+d.STR+'</td><td class="num">'+d.DEF+'</td><td class="num">'+d.SPD+'</td>'
        +'<td class="num"><span class="gold-pill">'+(d.startGoldCopper||0)+'</span></td>'
        +'<td class="num">'+(sk?'<span class="sk-pill" title="'+esc((d.skills||[]).join(', '))+'">'+sk+'</span>':'<span class="dim">—</span>')+'</td>'
        +'<td class="num">'+(nEq?'<span class="eq-pill" title="'+esc(eqTitle(d))+'">'+nEq+'</span>':'<span class="dim">—</span>')+'</td>'
        +'<td class="num">'+(nIt||'<span class="dim">—</span>')+'</td>'
        +'<td class="dim">'+(d._debugSample?'✓':'')+'</td></tr>';
    }).join('');
    statEl.textContent='共 '+data.length+' 条'+(rows.length!==data.length?' / 显示 '+rows.length:'');
    REG.counts.players=data.length; updateGlobalStat();
  }

  let dragKey=null,dropTarget=null;
  function clearDropMarkers(){ listBody.querySelectorAll('.drop-before,.drop-after').forEach(function(el){ el.classList.remove('drop-before','drop-after'); }); }
  function moveItem(srcKey,tgtKey,after){
    const si=data.findIndex(function(d){ return d.key===srcKey; }); if(si<0) return;
    const it=data.splice(si,1)[0];
    let ti=data.findIndex(function(d){ return d.key===tgtKey; });
    if(ti<0){ data.splice(si,0,it); return; }
    if(after) ti+=1;
    data.splice(ti,0,it); save(); renderList();
  }
  listBody.addEventListener('dragstart',function(e){ const tr=e.target.closest('tr'); if(!tr||!tr.dataset.key) return; dragKey=tr.dataset.key; tr.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; try{e.dataTransfer.setData('text/plain',dragKey);}catch(_){}});
  listBody.addEventListener('dragover',function(e){ if(!dragKey) return; e.preventDefault(); e.dataTransfer.dropEffect='move';
    const sc=listBody.closest('.left');
    if(sc){ const r0=sc.getBoundingClientRect(); if(e.clientY<r0.top+48) sc.scrollTop-=14; else if(e.clientY>r0.bottom-48) sc.scrollTop+=14; }
    const tr=e.target.closest('tr'); clearDropMarkers();
    if(!tr||!tr.dataset.key||tr.dataset.key===dragKey){ dropTarget=null; return; }
    const r=tr.getBoundingClientRect(); const after=(e.clientY-r.top)>r.height/2;
    tr.classList.add(after?'drop-after':'drop-before'); dropTarget={key:tr.dataset.key,after}; });
  listBody.addEventListener('drop',function(e){ if(!dragKey||!dropTarget) return; e.preventDefault(); const s=dragKey,t=dropTarget; dragKey=null;dropTarget=null;clearDropMarkers(); moveItem(s,t.key,t.after); });
  listBody.addEventListener('dragend',function(){ dragKey=null;dropTarget=null;clearDropMarkers(); listBody.querySelectorAll('tr.dragging').forEach(function(el){ el.classList.remove('dragging'); }); });
  listBody.addEventListener('click',function(e){ const tr=e.target.closest('tr'); if(!tr||!tr.dataset.key) return; if(tr.dataset.key===selectedKey) return; selectedKey=tr.dataset.key; renderList(); renderDetail(); });

  function renderStartEquipment(item){
    const eq=item.startEquipment||{};
    const slots=EQUIP_SLOTS.slice();
    for(const k in eq){ if(slots.indexOf(k)===-1) slots.push(k); }
    const rows=slots.map(function(slot){
      const id=eq[slot]||'';
      const miss=id&&hasItemsData()&&!itemsExists(id);
      const name=id?(hasItemsData()?(itemsExists(id)?itemName(id):'（缺失）'):''):'';
      return '<tr><td class="slot-name">'+esc(slot)+'</td>'
        +'<td><input type="text" data-equip-slot="'+esc(slot)+'" list="pItemList" value="'+esc(id)+'" placeholder="— 空 —"></td>'
        +'<td class="item-name '+(miss?'miss':'')+'">'+esc(name)+(miss?' ⚠':'')+'</td>'
        +'<td>'+(id?'<button type="button" class="del" data-equip-clear="'+esc(slot)+'">×</button>':'')+'</td></tr>';
    }).join('');
    return '<table class="pool-table"><thead><tr><th style="width:90px">槽位</th><th>itemId</th><th>名称</th><th style="width:36px"></th></tr></thead><tbody>'+rows+'</tbody></table>';
  }
  function renderStartItems(item){
    const list=item.startItems||[];
    if(!list.length) return '<div class="empty">暂无初始物品。点击「＋ 添加物品」开始。</div>';
    const rows=list.map(function(it,i){
      const miss=hasItemsData()&&!itemsExists(it.itemId);
      const name=hasItemsData()?(itemsExists(it.itemId)?itemName(it.itemId):'（缺失）'):'';
      return '<tr><td><input type="text" data-item-field="itemId" data-item-idx="'+i+'" list="pItemList" value="'+esc(it.itemId)+'"></td>'
        +'<td class="item-name '+(miss?'miss':'')+'">'+esc(name)+(miss?' ⚠':'')+'</td>'
        +'<td style="width:70px"><input type="number" data-item-field="qty" data-item-idx="'+i+'" value="'+it.qty+'" min="1" step="1"></td>'
        +'<td style="width:36px"><button type="button" class="del" data-item-del="'+i+'">×</button></td></tr>';
    }).join('');
    return '<table class="pool-table"><thead><tr><th>itemId</th><th>名称</th><th>数量</th><th></th></tr></thead><tbody>'+rows+'</tbody></table>';
  }
  function renderCheckPanel(item){
    let h='<div class="check-panel" id="pCheck">';
    const lines=[];
    const sk=item.skills||[];
    if(sk.length){
      const unknown=REG.skills.length?sk.filter(function(id){ return !REG.hasSkill(id); }):[];
      lines.push('<div class="row">初始技能 <b>'+sk.length+'</b> 个：'+esc(sk.map(function(id){ return id+(REG.skillName(id)?'（'+REG.skillName(id)+'）':''); }).join('、'))+'</div>');
      if(unknown.length) lines.push('<div class="row err">⚠ 技能表中找不到：'+esc(unknown.join(', '))+'</div>');
    } else lines.push('<div class="row">未配置初始技能。</div>');

    if(!hasItemsData()){
      lines.push('<div class="row">未加载 items.json，跳过 itemId 校验。</div>');
    } else {
      const eq=item.startEquipment||{}, items=item.startItems||[];
      const missEq=Object.keys(eq).filter(function(s){ return !itemsExists(eq[s]); }).map(function(s){ return s+':'+eq[s]; });
      const missIt=items.filter(function(it){ return !itemsExists(it.itemId); }).map(function(it){ return it.itemId; });
      lines.push('<div class="row">初始装备 <b>'+Object.keys(eq).length+'</b> 件，初始物品 <b>'+items.length+'</b> 条。</div>');
      if(missEq.length) lines.push('<div class="row err">装备缺失 itemId：'+esc(missEq.join(', '))+'</div>');
      if(missIt.length) lines.push('<div class="row err">物品缺失 itemId：'+esc(Array.from(new Set(missIt)).join(', '))+'</div>');
      if(!missEq.length&&!missIt.length) lines.push('<div class="row ok">✓ 初始装备与物品全部引用有效。</div>');
    }
    return h+lines.join('')+'</div>';
  }
  function refreshDerived(item){
    const hint=detail.querySelector('.derived');
    if(hint) hint.innerHTML='T_CRT 校验：<b>CRT × LUK × 0.01</b> = '+item.CRT+' × '+item.LUK+' × 0.01 = <b>'+(nz(item.CRT)*nz(item.LUK)*0.01).toFixed(4)+'</b>'
      +' &nbsp;·&nbsp; 暴击率 = clamp(T_CRT × 0.05, 0.02, 0.75) = <b>'+(critChance(item.T_CRT)*100).toFixed(2)+'%</b>';
  }

  function renderDetail(){
    const item=currentItem();
    if(!item){ detail.innerHTML='<p class="hint">← 从左侧选择一条玩家进行编辑</p>'; return; }
    let h='';
    h+='<div class="section-title">基本信息</div>';
    h+=fieldText('Key（对象键）','data-root="key"',item.key);
    h+='<div class="grid2">'+fieldText('_id（标识）','data-root="_id"',item._id)+fieldText('_name（名称）','data-root="_name"',item._name)+'</div>';
    h+=boolHTML('data-root="_debugSample"','_debugSample（调试样例）',item._debugSample);

    h+='<div class="section-title">等级</div><div class="grid4">'+numFieldHTML(NUM_FIELDS[0],item.lv)+'</div>';

    h+='<div class="section-title">战斗属性（12 字段）</div><div class="grid4">';
    for(let i=1;i<NUM_FIELDS.length;i++) h+=numFieldHTML(NUM_FIELDS[i],item[NUM_FIELDS[i].k]);
    h+='</div>';
    h+='<div class="derived">T_CRT 校验：<b>CRT × LUK × 0.01</b> = '+item.CRT+' × '+item.LUK+' × 0.01 = <b>'+(nz(item.CRT)*nz(item.LUK)*0.01).toFixed(4)+'</b>'
      +' &nbsp;·&nbsp; 暴击率 = clamp(T_CRT × 0.05, 0.02, 0.75) = <b>'+(critChance(item.T_CRT)*100).toFixed(2)+'%</b></div>';
    h+='<button type="button" class="mini" data-recalc="1" style="margin-top:6px">按公式重算 T_CRT</button>';

    /* 新增：玩家技能选择 */
    h+='<div class="section-title">初始技能 skills <span class="r">开局即掌握的技能</span></div>';
    h+=skillPickerHTML('p',item);

    h+='<div class="section-title">初始状态</div><div class="grid2">'
      +fieldNum('startGoldCopper 初始铜币','data-num="startGoldCopper"',item.startGoldCopper||0,'1','0','可选，缺省 0')
      +'<div class="field"><div class="field-head"><label>storage.initRows 仓库初始行数</label><span class="tagline">留空 = containers.json</span></div>'
      +'<input type="number" step="1" min="1" data-storage="initRows" value="'+(item.storage&&item.storage.initRows?item.storage.initRows:'')+'" placeholder="留空则使用全局配置"></div>'
      +'</div>';

    h+='<div class="section-title">基础装备 startEquipment <span class="r">槽位 → itemId，空槽省略</span></div>';
    h+=renderStartEquipment(item);

    h+='<div class="section-title">初始物品 startItems <span class="r">放入背包，溢出到仓库</span></div>';
    h+=renderStartItems(item);
    h+='<div class="pool-actions"><button type="button" class="mini" data-add-start-item="1">＋ 添加物品</button></div>';
    h+=renderCheckPanel(item);

    detail.innerHTML=h;
  }

  function onEdit(e){
    const el=e.target, item=currentItem(); if(!item) return;

    /* 技能选择 */
    if(el.dataset.pSkillIdx!==undefined){
      const i=Number(el.dataset.pSkillIdx);
      item.skills[i]=String(el.value).trim();
      if(e.type==='change'){ item.skills=item.skills.filter(Boolean); save(); renderList(); renderDetail(); }
      else save();
      return;
    }

    if(el.dataset.equipSlot){
      const slot=el.dataset.equipSlot, v=String(el.value).trim();
      if(v) item.startEquipment[slot]=v; else delete item.startEquipment[slot];
      if(e.type==='change') renderDetail();
      save(); return;
    }
    if(el.dataset.itemField){
      const i=Number(el.dataset.itemIdx), f=el.dataset.itemField, it=item.startItems[i]; if(!it) return;
      if(f==='itemId'){ it.itemId=String(el.value).trim(); if(e.type==='change') renderDetail(); }
      else if(f==='qty'){ let v=Math.floor(Number(el.value)); if(!isFinite(v)||v<1) v=1; it.qty=v; }
      save(); renderList(); return;
    }
    if(el.dataset.storage){
      const k=el.dataset.storage, raw=String(el.value).trim();
      if(raw==='') delete item.storage[k];
      else { let v=Math.floor(Number(raw)); if(!isFinite(v)||v<1) v=1; item.storage[k]=v; }
      save(); return;
    }
    if(el.dataset.root){
      const k=el.dataset.root;
      if(k==='key'){
        if(e.type!=='change') return;
        const nv=String(el.value).trim();
        if(!nv){ el.value=item.key; return; }
        if(nv===item.key) return;
        if(data.some(function(d){ return d!==item&&d.key===nv; })){ alert('Key 已存在：'+nv); el.value=item.key; return; }
        item.key=nv; if(!item._id||item._id===selectedKey) item._id=nv;
        selectedKey=nv; renderList(); renderDetail(); save(); return;
      }
      if(k==='_debugSample'){ item._debugSample=el.checked; renderDetail(); renderList(); save(); return; }
      item[k]=el.value; renderList(); save(); return;
    }
    if(el.dataset.num){
      const k=el.dataset.num;
      let v=el.value===''?0:Number(el.value); if(!isFinite(v)) v=0;
      if(k==='lv'||k==='HP'||k==='SPD') v=Math.max(1,Math.floor(v));
      if(k==='startGoldCopper') v=Math.max(0,Math.floor(v));
      item[k]=v;
      if(k==='CRT'||k==='LUK'||k==='T_CRT') refreshDerived(item);
      renderList(); save(); return;
    }
  }
  detail.addEventListener('input',onEdit);
  detail.addEventListener('change',onEdit);
  detail.addEventListener('click',function(e){
    const item=currentItem(); if(!item) return;
    if(e.target.closest('[data-recalc]')){ item.T_CRT=+(nz(item.CRT)*nz(item.LUK)*0.01).toFixed(4); renderDetail(); renderList(); save(); return; }
    if(e.target.closest('[data-add-start-item]')){ item.startItems.push({itemId:'',qty:1}); save(); renderList(); renderDetail(); return; }
    const di=e.target.closest('[data-item-del]');
    if(di){ const i=Number(di.dataset.itemDel); if(i>=0&&i<item.startItems.length) item.startItems.splice(i,1); save(); renderList(); renderDetail(); return; }
    const ec=e.target.closest('[data-equip-clear]');
    if(ec){ delete item.startEquipment[ec.dataset.equipClear]; save(); renderList(); renderDetail(); return; }
    if(e.target.closest('[data-p-skill-add]')){ item.skills.push(''); save(); renderDetail(); return; }
    const sd=e.target.closest('[data-p-skill-del]');
    if(sd){ item.skills.splice(Number(sd.dataset.pSkillDel),1); save(); renderList(); renderDetail(); return; }
  });

  function nextKey(){
    let max=0;
    data.forEach(function(d){ const m=String(d.key).match(/^p(\d+)$/); if(m) max=Math.max(max,parseInt(m[1],10)); });
    return 'p'+(max+1);
  }
  document.getElementById('pAddBtn').onclick=function(){
    const key=nextKey();
    data.push(normalizeEntry(key,{_id:key,_name:'新玩家',_debugSample:false,lv:1,HP:100,MP:100,STR:100,DEF:100,MGA:100,MGD:100,
      SPD:100,CRT:1.001,T_CRT:1.001,LUK:100,GP:1,Cont:0.5,skills:[],startGoldCopper:0,startEquipment:{},startItems:[],storage:{}}));
    selectedKey=key; renderList(); renderDetail(); save();
  };
  document.getElementById('pDupBtn').onclick=function(){
    const src=currentItem(); if(!src) return;
    const copy=JSON.parse(JSON.stringify(src));
    copy.key=nextKey(); copy._id=copy.key; copy._name=(copy._name||'')+'_副本'; copy._debugSample=false;
    data.push(copy); selectedKey=copy.key; renderList(); renderDetail(); save();
  };
  document.getElementById('pDelBtn').onclick=function(){
    if(!selectedKey) return;
    if(!confirm('确认删除 '+selectedKey+' ?')) return;
    const idx=data.findIndex(function(d){ return d.key===selectedKey; }); if(idx<0) return;
    data.splice(idx,1);
    selectedKey=data.length?data[Math.min(idx,data.length-1)].key:null;
    renderList(); renderDetail(); save();
  };

  const importFile=document.getElementById('pImportFile');
  document.getElementById('pImportBtn').onclick=function(){ importFile.click(); };
  pickFile(importFile,function(obj){
    if(Array.isArray(obj)) data=obj.map(function(x,i){ return normalizeEntry(x.key!=null?x.key:('p'+(i+1)),x); });
    else if(obj&&typeof obj==='object') data=Object.keys(obj).map(function(k){ return normalizeEntry(k,obj[k]); });
    else throw new Error('根节点必须是对象或数组');
    selectedKey=data.length?data[0].key:null;
    renderList(); renderDetail(); save();
    alert('已导入 '+data.length+' 条玩家。');
  });
  document.getElementById('pLoadItemsBtn').onclick=function(){ document.getElementById('pItemsFile').click(); };
  pickFile(document.getElementById('pItemsFile'),applyItemsTable);
  clearItemsBtn.onclick=clearItemsTable;
  document.getElementById('pRevalidateBtn').onclick=function(){ renderList(); renderDetail(); };

  function buildEntry(d){
    const out={};
    ENTRY_ORDER.forEach(function(k){
      if(k==='_debugSample'){ if(d._debugSample) out[k]=true; return; }
      if(k==='skills'){ const s=(d.skills||[]).filter(Boolean); if(s.length) out[k]=s.slice(); return; }
      if(k==='startGoldCopper'){ if(d.startGoldCopper>0) out[k]=d.startGoldCopper; return; }
      if(k==='startEquipment'){ const eq=d.startEquipment||{}; if(Object.keys(eq).length) out[k]=eq; return; }
      if(k==='startItems'){
        const list=Array.isArray(d.startItems)?d.startItems:[];
        if(list.length) out[k]=list.map(function(x){ return {itemId:x.itemId,qty:x.qty}; });
        return;
      }
      if(k==='storage'){
        const st=d.storage||{};
        if(Number.isFinite(st.initRows)&&st.initRows>=1) out[k]={initRows:st.initRows};
        return;
      }
      if(d[k]!==undefined&&d[k]!==null) out[k]=d[k];
    });
    Object.keys(d).forEach(function(k){
      if(!(k in out)&&k!=='key'&&k!=='startEquipment'&&k!=='startItems'&&k!=='storage'&&k!=='skills') out[k]=d[k];
    });
    return out;
  }
  function buildJSONText(){
    return '{\n'+data.map(function(d){
      return '  '+JSON.stringify(d.key)+': '+indentBlock(JSON.stringify(buildEntry(d),null,2),1);
    }).join(',\n')+'\n}';
  }
  document.getElementById('pExportBtn').onclick=function(){ download('players.json',buildJSONText()); };

  searchInput.addEventListener('input',renderList);
  fLvMin.addEventListener('input',renderList);
  fLvMax.addEventListener('input',renderList);
  document.querySelectorAll('[data-ptri]').forEach(function(btn){
    const st={key:btn.dataset.ptri,state:'all',btn:btn}; triStates.push(st);
    btn.addEventListener('click',function(){
      st.state=st.state==='all'?'on':(st.state==='on'?'off':'all');
      btn.dataset.state=st.state;
      btn.querySelector('.tri-val').textContent=st.state==='all'?'全部':(st.state==='on'?'是':'否');
      renderList();
    });
  });
  document.getElementById('pResetFilter').onclick=function(){
    searchInput.value=''; fLvMin.value=''; fLvMax.value='';
    triStates.forEach(function(t){ t.state='all'; t.btn.dataset.state='all'; t.btn.querySelector('.tri-val').textContent='全部'; });
    renderList();
  };

  (function init(){
    const parsed=loadLS(LS_KEY);
    data=Array.isArray(parsed)&&parsed.length?parsed.map(function(d){ return normalizeEntry(d.key,d); }):defaultData();
    selectedKey=data.length?data[0].key:null;
    renderList(); renderDetail();
  })();

  return {
    renderList:renderList, renderDetail:renderDetail,
    onShow:function(){ renderList(); renderDetail(); },
    exportJSON:function(){ download('players.json',buildJSONText()); },
    count:function(){ return data.length; }
  };
})();

/* =========================================================
   SECTION: 全局导出与启动
   ========================================================= */
document.getElementById('exportAllBtn').onclick=function(){
  MODULES.skills.exportJSON();
  setTimeout(function(){ MODULES.monsters.exportJSON(); },500);
  setTimeout(function(){ MODULES.players.exportJSON(); },1000);
};

(function boot(){
  renderSkillDatalist();
  updateGlobalStat();
  const tab=(prefs.tab&&MODULES[prefs.tab])?prefs.tab:'skills';
  switchTab(tab);
})();

})();
</script>
</body>
</html>
