<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Damage Types 编辑器 · 骨架版</title>
<style>
  :root{
    --bg:#121212; --panel:#1A1A1A; --panel2:#202020; --line:#333;
    --text:#C8C8C8; --text-dim:#8A8A8A; --text-strong:#E8E8E8;
    --accent:#4A9EFF; --danger:#FF5A5A; --gain:#5FE0A0; --gold:#F0C040;
  }
  *{box-sizing:border-box}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font-family:Consolas,"Courier New",monospace;font-size:14px;
    height:100vh;display:flex;flex-direction:column;overflow:hidden;
  }
  header{
    display:flex;gap:8px;align-items:center;padding:10px 14px;
    background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap;
  }
  header h1{font-size:15px;margin:0 12px 0 0;color:var(--text-strong);font-weight:normal}
  button{
    background:var(--panel2);color:var(--text);border:1px solid var(--line);
    padding:5px 12px;cursor:pointer;font-family:inherit;font-size:13px;
  }
  button:hover{border-color:var(--accent);color:var(--text-strong)}
  button.danger:hover{border-color:var(--danger);color:var(--danger)}
  input,select{
    background:#0E0E0E;color:var(--text-strong);border:1px solid var(--line);
    padding:5px 8px;font-family:inherit;font-size:13px;width:100%;
  }
  input:focus,select:focus{outline:none;border-color:var(--accent)}
  #searchInput{width:190px}
  .stat{color:var(--text-dim);font-size:12px;margin-left:auto}
  .stat .ok{color:var(--gain)}
  .stat .err{color:var(--danger)}

  .toolbar{
    display:flex;gap:10px;align-items:center;flex-wrap:wrap;
    padding:8px 14px;background:#161616;border-bottom:1px solid var(--line);
    font-size:12px;
  }
  .toolbar label{display:flex;align-items:center;gap:5px;color:var(--text-dim)}
  .toolbar .fsep{width:1px;height:18px;background:var(--line)}
  .toolbar .hint{color:var(--text-dim);font-size:11px}
  .toolbar .ok{color:var(--gain)}
  .toolbar .miss{color:var(--danger)}
  .mini{
    font-size:11px;padding:3px 9px;background:#0E0E0E;
    border:1px solid var(--line);color:var(--accent);cursor:pointer;font-family:inherit;
  }
  .mini:hover{border-color:var(--accent)}
  .mini:disabled{opacity:.4;cursor:not-allowed}

  main{flex:1;display:flex;min-height:0}
  .left{flex:1;min-width:0;overflow:auto;border-right:1px solid var(--line)}
  .right{width:560px;flex:none;overflow:auto;padding:14px;background:var(--panel)}

  table{width:100%;border-collapse:collapse}
  th,td{padding:6px 10px;text-align:left;border-bottom:1px solid #222;white-space:nowrap}
  th{
    position:sticky;top:0;background:var(--panel2);color:var(--text-dim);
    font-weight:normal;font-size:12px;z-index:1;
  }
  tbody tr{cursor:pointer}
  tbody tr:hover{background:#1E1E1E}
  tbody tr.selected{background:#1A2A3A}
  tbody tr.dragging{opacity:.35}
  tbody tr.drop-before td{border-top:2px solid var(--accent)}
  tbody tr.drop-after td{border-bottom:2px solid var(--accent)}
  td.drag{cursor:grab;color:#4a4a4a;text-align:center;user-select:none;width:26px}
  td.drag:active{cursor:grabbing}
  .num{text-align:right;font-variant-numeric:tabular-nums}
  .dim{color:var(--text-dim)}
  .hint{color:var(--text-dim);text-align:center;padding:40px 0}
  .miss{color:var(--danger)}

  .field{margin-bottom:9px}
  .field label{display:block;color:var(--text-dim);font-size:12px;margin-bottom:3px}
  .field-head{display:flex;align-items:baseline;justify-content:space-between;gap:6px;margin-bottom:3px}
  .field-head label{margin:0}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
  .section-title{
    color:var(--accent);font-size:13px;margin:18px 0 10px;
    border-bottom:1px solid var(--line);padding-bottom:4px;
  }
  .section-title:first-child{margin-top:0}

  .tagline{font-size:11px;color:var(--text-dim);margin-top:3px}
  .tag{
    display:inline-block;font-size:11px;color:#9EC6FF;
    background:#1B2436;border:1px solid #2B3A55;border-radius:5px;padding:1px 6px;
  }
  .tag.ok{color:var(--gain);border-color:#2A5A3A;background:#0F1A12}
  .tag.warn{color:#E0A050;border-color:#5A4A2A;background:#1A150F}
  .tag.bad{color:var(--danger);border-color:#5A2C2C;background:#1A0F0F}

  .check-panel{
    margin-top:10px;padding:8px 10px;border-radius:4px;
    background:#0F1A22;border:1px solid #1E3A4A;font-size:12px;color:#7FCFFF;
  }
  .check-panel b{color:#BFE8FF}
  .check-panel .err{color:#E07A7A}
  .check-panel .ok{color:#5FE0A0}
  .check-panel .warn{color:#E0A050}
  .check-panel .row{margin:3px 0}

  .danger-zone{
    margin-top:18px;padding:10px 12px;border-radius:4px;
    background:#1A0F0F;border:1px solid #5A2C2C;
  }
  .danger-zone h3{
    margin:0 0 6px;font-size:12px;color:var(--danger);font-weight:normal;
  }
  .danger-zone p{margin:0 0 8px;font-size:11.5px;color:#C08080}

  .dt-row{
    display:grid;grid-template-columns:1fr 1fr;gap:0 10px;
  }
  .preview-box{
    background:#0F1A22;border:1px solid #1E3A4A;border-radius:4px;
    padding:8px 10px;font-size:12px;color:#7FCFFF;margin-top:8px;
  }
  .preview-box b{color:#BFE8FF;font-weight:600}
</style>
</head>
<body>

<header>
  <h1>Damage Types 编辑器 · 骨架版</h1>
  <button id="addBtn">＋ 新增</button>
  <button id="importBtn">导入 JSON</button>
  <button id="exportBtn">导出 JSON</button>
  <button id="resetBtn" class="danger">重置为骨架</button>
  <input type="text" id="searchInput" placeholder="搜索 Key / 显示名">
  <span class="stat" id="stat"></span>
</header>

<div class="toolbar">
  <label>引用参考
    <button id="loadSkillsBtn" class="mini">加载 skills.json</button>
    <button id="loadCompanionsBtn" class="mini">加载 companions.json</button>
    <button id="loadMonstersBtn" class="mini">加载 monsters.json</button>
    <button id="loadPlayersBtn" class="mini">加载 players.json</button>
    <button id="clearRefBtn" class="mini" disabled>清除参考</button>
    <input type="file" id="skillsFile" accept=".json" hidden>
    <input type="file" id="companionsFile" accept=".json" hidden>
    <input type="file" id="monstersFile" accept=".json" hidden>
    <input type="file" id="playersFile" accept=".json" hidden>
  </label>
  <span id="refStatus" class="hint">未加载</span>
  <span class="fsep"></span>
  <button id="revalidateBtn" class="mini">重新校验</button>
  <span class="hint">不加载也能编辑；加载后校验引用与未映射值。</span>
</div>

<main>
  <div class="left">
    <table>
      <thead>
        <tr>
          <th></th>
          <th>Key</th>
          <th>显示名</th>
          <th class="num">skills</th>
          <th class="num">companions</th>
          <th class="num">monsters</th>
          <th class="num">players</th>
        </tr>
      </thead>
      <tbody id="listBody"></tbody>
    </table>
  </div>
  <div class="right" id="detail"></div>
</main>

<input type="file" id="importInput" accept=".json" hidden>

<script>
(function(){
'use strict';

/* =========================================================
   常量
   ========================================================= */
const LS_KEY = 'damage_types_editor_skeleton_v1';

/* 骨架 damage_types.json 默认值 */
function defaultData(){
  return [
    { key: 'physical', label: '物理' },
    { key: 'magical',  label: '魔法' }
  ];
}

/* =========================================================
   状态
   ========================================================= */
let types = defaultData();
let selectedKey = null;

/* 引用表：null 表示未加载 */
let refs = {
  skills:     null,
  companions: null,
  monsters:   null,
  players:    null
};

const listBody     = document.getElementById('listBody');
const detail       = document.getElementById('detail');
const stat         = document.getElementById('stat');
const searchInput  = document.getElementById('searchInput');
const refStatus    = document.getElementById('refStatus');
const clearRefBtn  = document.getElementById('clearRefBtn');

/* =========================================================
   工具
   ========================================================= */
function esc(s){
  return String(s === null || s === undefined ? '' : s)
    .replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function save(){
  try { localStorage.setItem(LS_KEY, JSON.stringify(exportable())); } catch(e){}
}
function currentType(){
  return types.find(t => t.key === selectedKey) || null;
}

/* =========================================================
   归一化 / 导出
   ========================================================= */
function normalize(raw){
  if (!raw || typeof raw !== 'object' || Array.isArray(raw)) return defaultData();
  const arr = [];
  Object.keys(raw).forEach(k => {
    const v = raw[k];
    arr.push({
      key: String(k),
      label: v != null ? String(v) : String(k)
    });
  });
  return arr.length ? arr : defaultData();
}

function exportable(){
  const out = {};
  types.forEach(t => { out[t.key] = t.label || ''; });
  return out;
}

/* =========================================================
   引用统计
   ========================================================= */
function collectRefs(tableObj, fieldName){
  /* tableObj 可能是对象或数组；返回 {value -> [keys]} */
  const acc = {};
  if (!tableObj) return acc;
  const each = (key, entry) => {
    if (!entry || typeof entry !== 'object') return;
    const v = entry[fieldName];
    if (v === undefined || v === null || v === '') return;
    const k = String(v);
    if (!acc[k]) acc[k] = [];
    acc[k].push(key);
  };
  if (Array.isArray(tableObj)){
    tableObj.forEach((e, i) => each(String(e && e._id != null ? e._id : i), e));
  } else {
    Object.keys(tableObj).forEach(k => each(k, tableObj[k]));
  }
  return acc;
}

function computeUsage(){
  /* 返回 { typeKey: { skills:[...], companions:[...], monsters:[...], players:[...] } } */
  const out = {};
  types.forEach(t => {
    out[t.key] = { skills:[], companions:[], monsters:[], players:[] };
  });
  const unknown = { skills:{}, companions:{}, monsters:{}, players:{} };

  const add = (src, ref) => {
    if (!ref) return;
    const byVal = collectRefs(ref, 'damageType');
    Object.keys(byVal).forEach(val => {
      if (out[val]){
        out[val][src] = byVal[val].slice();
      } else {
        if (!unknown[src][val]) unknown[src][val] = [];
        unknown[src][val] = unknown[src][val].concat(byVal[val]);
      }
    });
  };

  add('skills', refs.skills);
  add('companions', refs.companions);
  add('monsters', refs.monsters);
  add('players', refs.players);

  return { usage: out, unknown };
}

function countLoadedRefs(){
  let n = 0;
  if (refs.skills) n++;
  if (refs.companions) n++;
  if (refs.monsters) n++;
  if (refs.players) n++;
  return n;
}

/* =========================================================
   列表
   ========================================================= */
function visibleTypes(){
  const q = searchInput.value.trim().toLowerCase();
  if (!q) return types.slice();
  return types.filter(t =>
    t.key.toLowerCase().indexOf(q) !== -1 ||
    String(t.label || '').toLowerCase().indexOf(q) !== -1
  );
}

function renderList(){
  const rows = visibleTypes();
  const hasAnyRef = countLoadedRefs() > 0;
  const { usage } = computeUsage();

  if (!types.length){
    listBody.innerHTML = `<tr><td colspan="7" class="hint">类型为空。点击「＋ 新增」开始。</td></tr>`;
    stat.textContent = '共 0 个伤害类型';
    return;
  }

  const cell = (arr) => {
    if (!hasAnyRef) return `<span class="dim">—</span>`;
    if (!refs) return `<span class="dim">—</span>`;
    return `<span class="${arr.length ? '' : 'dim'}">${arr.length}</span>`;
  };

  listBody.innerHTML = rows.map(t => {
    const u = usage[t.key] || {skills:[],companions:[],monsters:[],players:[]};
    return `<tr data-key="${esc(t.key)}" draggable="true" class="${t.key===selectedKey?'selected':''}">
      <td class="drag">⠿</td>
      <td>${esc(t.key)}</td>
      <td>${esc(t.label || '')}</td>
      <td class="num">${cell(u.skills)}</td>
      <td class="num">${cell(u.companions)}</td>
      <td class="num">${cell(u.monsters)}</td>
      <td class="num">${cell(u.players)}</td>
    </tr>`;
  }).join('');

  stat.textContent = `共 ${types.length} 个伤害类型` +
    (rows.length !== types.length ? ` / 显示 ${rows.length}` : '');
  stat.className = 'stat';
}

/* =========================================================
   拖拽排序
   ========================================================= */
let dragKey = null;
let dropTarget = null;

function clearDropMarkers(){
  listBody.querySelectorAll('.drop-before,.drop-after').forEach(el => {
    el.classList.remove('drop-before','drop-after');
  });
}
function moveItem(srcKey, tgtKey, after){
  const si = types.findIndex(t => t.key === srcKey);
  if (si < 0) return;
  const item = types.splice(si, 1)[0];
  let ti = types.findIndex(t => t.key === tgtKey);
  if (ti < 0){ types.splice(si, 0, item); return; }
  if (after) ti += 1;
  types.splice(ti, 0, item);
  save(); renderList();
}

listBody.addEventListener('dragstart', e => {
  const tr = e.target.closest('tr');
  if (!tr || !tr.dataset.key) return;
  dragKey = tr.dataset.key;
  tr.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
  try { e.dataTransfer.setData('text/plain', dragKey); } catch(_){}
});
listBody.addEventListener('dragover', e => {
  if (!dragKey) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  const tr = e.target.closest('tr');
  clearDropMarkers();
  if (!tr || !tr.dataset.key || tr.dataset.key === dragKey){ dropTarget = null; return; }
  const r = tr.getBoundingClientRect();
  const after = (e.clientY - r.top) > r.height/2;
  tr.classList.add(after ? 'drop-after' : 'drop-before');
  dropTarget = {key: tr.dataset.key, after};
});
listBody.addEventListener('drop', e => {
  if (!dragKey || !dropTarget) return;
  e.preventDefault();
  const src = dragKey;
  const t = dropTarget;
  dragKey = null; dropTarget = null;
  clearDropMarkers();
  moveItem(src, t.key, t.after);
});
listBody.addEventListener('dragend', () => {
  dragKey = null; dropTarget = null;
  clearDropMarkers();
  listBody.querySelectorAll('tr.dragging').forEach(el => el.classList.remove('dragging'));
});

/* =========================================================
   详情
   ========================================================= */
function renderCheckPanel(t){
  const loaded = countLoadedRefs();
  if (!loaded){
    return `<div class="check-panel">
      <div class="row">未加载任何引用表，跳过校验。可加载 skills / companions / monsters / players 校验 <code>damageType</code> 字段。</div>
    </div>`;
  }

  const { usage, unknown } = computeUsage();
  const u = usage[t.key] || {skills:[],companions:[],monsters:[],players:[]};
  const lines = [];
  const total = u.skills.length + u.companions.length + u.monsters.length + u.players.length;
  lines.push(`<div class="row">该类型被 <b>${total}</b> 处引用：skills <b>${u.skills.length}</b> · companions <b>${u.companions.length}</b> · monsters <b>${u.monsters.length}</b> · players <b>${u.players.length}</b></div>`);

  const unknownKeys = Object.keys(unknown.skills).concat(
    Object.keys(unknown.companions),
    Object.keys(unknown.monsters),
    Object.keys(unknown.players)
  ).filter((v, i, a) => a.indexOf(v) === i);

  if (unknownKeys.length){
    lines.push(`<div class="row err">引用表中存在 ${unknownKeys.length} 个未在本表定义的 damageType 值：</div>`);
    unknownKeys.forEach(v => {
      const srcs = [];
      if (unknown.skills[v]) srcs.push(`skills ${unknown.skills[v].length}`);
      if (unknown.companions[v]) srcs.push(`companions ${unknown.companions[v].length}`);
      if (unknown.monsters[v]) srcs.push(`monsters ${unknown.monsters[v].length}`);
      if (unknown.players[v]) srcs.push(`players ${unknown.players[v].length}`);
      lines.push(`<div class="row err">· <code>${esc(v)}</code>（${srcs.join(', ')}）</div>`);
    });
    lines.push(`<div class="row">可在此表新增对应 key 来消除未映射值。</div>`);
  } else {
    lines.push(`<div class="row ok">✓ 引用表中所有 damageType 均可映射。</div>`);
  }

  return `<div class="check-panel">${lines.join('')}</div>`;
}

function renderDetail(){
  const t = currentType();
  if (!t){
    detail.innerHTML = `<p class="hint">← 从左侧选择一个伤害类型进行编辑，或点击「＋ 新增」。</p>`;
    return;
  }

  let h = '';

  h += '<div class="section-title">类型信息</div>';
  h += `<div class="field">
    <div class="field-head"><label>Key（类型 id）</label></div>
    <input type="text" id="dtKeyInput" value="${esc(t.key)}">
    <div class="tagline">战斗公式与技能表读这个值；重命名会断开引用，需要同步改 skills / companions / monsters / players。</div>
  </div>`;
  h += `<div class="field">
    <div class="field-head"><label>显示名</label></div>
    <input type="text" id="dtLabelInput" value="${esc(t.label || '')}">
    <div class="tagline">技能编辑器、对手面板、战斗日志里显示的名称。</div>
  </div>`;

  h += '<div class="section-title">引用</div>';
  h += renderCheckPanel(t);

  h += `<div class="danger-zone">
    <h3>删除类型</h3>
    <p>删除后，引用表里 <code>damageType="${esc(t.key)}"</code> 的条目会变成未映射值。</p>
    <button id="delTypeBtn" class="danger">删除此类型</button>
  </div>`;

  detail.innerHTML = h;

  const keyInput   = document.getElementById('dtKeyInput');
  const labelInput = document.getElementById('dtLabelInput');
  const delBtn     = document.getElementById('delTypeBtn');

  keyInput.addEventListener('change', () => {
    const nv = String(keyInput.value).trim();
    if (!nv){
      alert('Key 不能为空');
      keyInput.value = t.key;
      return;
    }
    if (nv === t.key) return;
    if (!/^[a-zA-Z][a-zA-Z0-9_]*$/.test(nv)){
      alert('Key 只能包含字母、数字、下划线，且以字母开头');
      keyInput.value = t.key;
      return;
    }
    if (types.some(x => x !== t && x.key === nv)){
      alert('Key 已存在：' + nv);
      keyInput.value = t.key;
      return;
    }
    t.key = nv;
    selectedKey = nv;
    save(); renderList(); renderDetail();
  });

  labelInput.addEventListener('input', () => {
    t.label = labelInput.value;
    renderList(); save();
  });
  labelInput.addEventListener('change', () => {
    if (!t.label) { t.label = t.key; labelInput.value = t.label; save(); }
  });

  delBtn.addEventListener('click', () => {
    if (types.length <= 1){
      alert('至少保留 1 个伤害类型');
      return;
    }
    if (!confirm(`确认删除类型 "${t.key}"？引用方会变成未映射值。`)) return;
    const idx = types.findIndex(x => x.key === t.key);
    if (idx < 0) return;
    types.splice(idx, 1);
    selectedKey = types.length ? types[Math.min(idx, types.length - 1)].key : null;
    save(); renderList(); renderDetail();
  });
}

/* =========================================================
   列表交互
   ========================================================= */
listBody.addEventListener('click', e => {
  const tr = e.target.closest('tr');
  if (!tr || !tr.dataset.key) return;
  if (tr.dataset.key === selectedKey) return;
  selectedKey = tr.dataset.key;
  renderList(); renderDetail();
});

/* =========================================================
   新增 / 重置
   ========================================================= */
function nextTypeKey(){
  let i = 1;
  while (types.some(t => t.key === 'type' + i)) i++;
  return 'type' + i;
}

document.getElementById('addBtn').onclick = () => {
  const key = nextTypeKey();
  types.push({ key, label: '新类型 ' + key });
  selectedKey = key;
  save(); renderList(); renderDetail();
};

document.getElementById('resetBtn').onclick = () => {
  if (!confirm('重置为骨架数据？当前编辑将丢失。')) return;
  types = defaultData();
  selectedKey = types[0].key;
  save(); renderList(); renderDetail();
};

/* =========================================================
   导入 / 导出
   ========================================================= */
document.getElementById('importBtn').onclick = () => {
  document.getElementById('importInput').click();
};

document.getElementById('importInput').onchange = e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try{
      const raw = JSON.parse(ev.target.result);
      if (!raw || typeof raw !== 'object' || Array.isArray(raw)){
        throw new Error('根节点必须是对象，形如 { "physical":"物理", ... }');
      }
      types = normalize(raw);
      selectedKey = types[0].key;
      save(); renderList(); renderDetail();
    }catch(err){
      alert('导入失败：' + err.message);
    }
  };
  reader.readAsText(file);
  e.target.value = '';
};

document.getElementById('exportBtn').onclick = () => {
  const text = JSON.stringify(exportable(), null, 2);
  const blob = new Blob([text], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'damage_types.json';
  a.click();
  URL.revokeObjectURL(a.href);
};

/* =========================================================
   引用表加载
   ========================================================= */
function updateRefStatus(){
  const labels = [];
  if (refs.skills) labels.push(`skills <span class="ok">${Array.isArray(refs.skills) ? refs.skills.length : Object.keys(refs.skills).length}</span>`);
  if (refs.companions) labels.push(`companions <span class="ok">${Array.isArray(refs.companions) ? refs.companions.length : Object.keys(refs.companions).length}</span>`);
  if (refs.monsters) labels.push(`monsters <span class="ok">${Array.isArray(refs.monsters) ? refs.monsters.length : Object.keys(refs.monsters).length}</span>`);
  if (refs.players) labels.push(`players <span class="ok">${Array.isArray(refs.players) ? refs.players.length : Object.keys(refs.players).length}</span>`);
  if (!labels.length){
    refStatus.textContent = '未加载';
    refStatus.className = 'hint';
    clearRefBtn.disabled = true;
  } else {
    refStatus.innerHTML = '已加载：' + labels.join(' · ');
    refStatus.className = 'hint';
    clearRefBtn.disabled = false;
  }
}

function loadRefFile(inputId, targetKey){
  const input = document.getElementById(inputId);
  input.value = '';
  input.onchange = e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try{
        const raw = JSON.parse(ev.target.result);
        if (!raw || typeof raw !== 'object'){
          throw new Error('根节点必须是对象或数组');
        }
        refs[targetKey] = raw;
        updateRefStatus();
        renderList(); renderDetail();
      }catch(err){
        alert(`${targetKey}.json 解析失败：` + err.message);
      }
    };
    reader.readAsText(file);
  };
  input.click();
}

document.getElementById('loadSkillsBtn').onclick = () => loadRefFile('skillsFile', 'skills');
document.getElementById('loadCompanionsBtn').onclick = () => loadRefFile('companionsFile', 'companions');
document.getElementById('loadMonstersBtn').onclick = () => loadRefFile('monstersFile', 'monsters');
document.getElementById('loadPlayersBtn').onclick = () => loadRefFile('playersFile', 'players');

clearRefBtn.onclick = () => {
  refs = { skills:null, companions:null, monsters:null, players:null };
  updateRefStatus();
  renderList(); renderDetail();
};

document.getElementById('revalidateBtn').onclick = () => {
  renderList(); renderDetail();
};

/* =========================================================
   筛选
   ========================================================= */
searchInput.addEventListener('input', renderList);

/* =========================================================
   启动
   ========================================================= */
(function init(){
  const raw = localStorage.getItem(LS_KEY);
  if (raw){
    try{
      types = normalize(JSON.parse(raw));
    }catch(_){ types = defaultData(); }
  } else {
    types = defaultData();
  }
  selectedKey = types.length ? types[0].key : null;
  updateRefStatus();
  renderList(); renderDetail();
})();

})();
</script>
