<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Merchants 表编辑器 · 骨架版</title>
<style>
  :root{
    --bg:#121212; --panel:#1A1A1A; --panel2:#202020; --line:#333;
    --text:#C8C8C8; --text-dim:#8A8A8A; --text-strong:#E8E8E8;
    --accent:#4A9EFF; --danger:#FF5A5A; --gain:#5FE0A0; --gold:#F0C040;
  }
  *{box-sizing:border-box}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font-family:Consolas,"Courier New",monospace;font-size:14px;
    height:100vh;display:flex;flex-direction:column;overflow:hidden;
  }
  header{
    display:flex;gap:8px;align-items:center;padding:10px 14px;
    background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap;
  }
  header h1{font-size:15px;margin:0 12px 0 0;color:var(--text-strong);font-weight:normal}
  button{
    background:var(--panel2);color:var(--text);border:1px solid var(--line);
    padding:5px 12px;cursor:pointer;font-family:inherit;font-size:13px;
  }
  button:hover{border-color:var(--accent);color:var(--text-strong)}
  button.danger:hover{border-color:var(--danger);color:var(--danger)}
  input,select,textarea{
    background:#0E0E0E;color:var(--text-strong);border:1px solid var(--line);
    padding:5px 8px;font-family:inherit;font-size:13px;width:100%;
  }
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
  input[type=number]::-webkit-inner-spin-button,
  input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
  #searchInput{width:190px}
  .stat{color:var(--text-dim);font-size:12px;margin-left:auto}
  .stat .ok{color:var(--gain)}
  .stat .err{color:var(--danger)}

  .toolbar{
    display:flex;gap:10px;align-items:center;flex-wrap:wrap;
    padding:8px 14px;background:#161616;border-bottom:1px solid var(--line);
    font-size:12px;
  }
  .toolbar label{display:flex;align-items:center;gap:5px;color:var(--text-dim)}
  .toolbar .fsep{width:1px;height:18px;background:var(--line)}
  .toolbar .hint{color:var(--text-dim);font-size:11px}
  .toolbar .ok{color:var(--gain)}
  .toolbar .miss{color:var(--danger)}
  .mini{
    font-size:11px;padding:3px 9px;background:#0E0E0E;
    border:1px solid var(--line);color:var(--accent);cursor:pointer;font-family:inherit;
  }
  .mini:hover{border-color:var(--accent)}
  .mini:disabled{opacity:.4;cursor:not-allowed}

  main{flex:1;display:flex;min-height:0}
  .left{flex:1;min-width:0;overflow:auto;border-right:1px solid var(--line)}
  .right{width:620px;flex:none;overflow:auto;padding:14px;background:var(--panel)}

  table{width:100%;border-collapse:collapse}
  th,td{padding:6px 10px;text-align:left;border-bottom:1px solid #222;white-space:nowrap}
  th{
    position:sticky;top:0;background:var(--panel2);color:var(--text-dim);
    font-weight:normal;font-size:12px;z-index:1;
  }
  tbody tr{cursor:pointer}
  tbody tr:hover{background:#1E1E1E}
  tbody tr.selected{background:#1A2A3A}
  tbody tr.dragging{opacity:.35}
  tbody tr.drop-before td{border-top:2px solid var(--accent)}
  tbody tr.drop-after td{border-bottom:2px solid var(--accent)}
  td.drag{cursor:grab;color:#4a4a4a;text-align:center;user-select:none;width:26px}
  td.drag:active{cursor:grabbing}
  .num{text-align:right;font-variant-numeric:tabular-nums}
  .dim{color:var(--text-dim)}
  .hint{color:var(--text-dim);text-align:center;padding:40px 0}
  .miss{color:var(--danger)}

  .field{margin-bottom:9px}
  .field label{display:block;color:var(--text-dim);font-size:12px;margin-bottom:3px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 8px}
  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:0 8px}
  .section-title{
    color:var(--accent);font-size:13px;margin:18px 0 10px;
    border-bottom:1px solid var(--line);padding-bottom:4px;
    display:flex;align-items:center;gap:8px;
  }
  .section-title:first-child{margin-top:0}
  .section-title .r{margin-left:auto;font-size:11px;color:var(--text-dim);font-weight:normal}

  .bool-item{
    display:flex;align-items:center;gap:8px;padding:4px 0;
    cursor:pointer;font-size:12px;color:var(--text);
  }
  .bool-item input{display:none}
  .bool-item .track{
    width:30px;height:16px;border-radius:8px;background:#2a2a2a;
    border:1px solid var(--line);position:relative;flex:none;margin-left:auto;
    transition:background .15s,border-color .15s;
  }
  .bool-item .track::after{
    content:'';position:absolute;top:1px;left:1px;width:12px;height:12px;
    border-radius:50%;background:#666;transition:transform .15s,background .15s;
  }
  .bool-item input:checked + .track{background:#16324d;border-color:var(--accent)}
  .bool-item input:checked + .track::after{transform:translateX(14px);background:var(--accent)}

  .tagline{font-size:11px;color:var(--text-dim);margin-top:3px}
  
  .chk-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px 8px;margin-top:4px}
  .chk{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text);cursor:pointer}
  .chk input{width:auto;accent-color:var(--accent)}

  .pool-table{width:100%;border-collapse:collapse;margin-top:4px}
  .pool-table th,.pool-table td{padding:4px 5px;border-bottom:1px solid #222;text-align:left;font-size:12px}
  .pool-table th{color:var(--text-dim);font-weight:normal;font-size:11px}
  .pool-table td input{padding:3px 6px;font-size:12px}
  .pool-table tr.missing td{background:#2A1010}
  .pool-table .name{color:var(--text-dim);font-size:11px;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pool-table .del{
    background:transparent;border:1px solid var(--line);color:var(--danger);
    padding:1px 8px;font-size:12px;cursor:pointer;border-radius:3px;
  }
  .pool-table .del:hover{border-color:var(--danger)}
  .drop-actions{display:flex;gap:8px;align-items:center;margin-top:6px}

  .check-panel{
    margin-top:10px;padding:8px 10px;border-radius:4px;
    background:#0F1A22;border:1px solid #1E3A4A;font-size:12px;color:#7FCFFF;
  }
  .check-panel b{color:#BFE8FF}
  .check-panel .err{color:#E07A7A}
  .check-panel .ok{color:#5FE0A0}
  .check-panel .row{margin:3px 0}
</style>
</head>
<body>

<header>
  <h1>Merchants 编辑器 · 骨架版</h1>
  <button id="addBtn">＋ 新增</button>
  <button id="dupBtn">⧉ 复制</button>
  <button id="delBtn" class="danger">－ 删除</button>
  <button id="importBtn">导入 JSON</button>
  <button id="exportBtn">导出 JSON</button>
  <input type="text" id="searchInput" placeholder="搜索 Key / 名字">
  <span class="stat" id="stat"></span>
</header>

<div class="toolbar">
  <label>Items 参考
    <button id="loadItemsBtn" class="mini">加载 items.json</button>
    <button id="clearItemsBtn" class="mini" disabled>清除参考</button>
    <input type="file" id="itemsFile" accept=".json" hidden>
  </label>
  <span id="itemsStatus" class="hint">未加载</span>
  <span class="fsep"></span>
  <button id="revalidateBtn" class="mini">重新校验</button>
  <span class="hint">不加载也能编辑；加载 items.json 后可自动补全 itemId 并校验货物池引用。</span>
</div>

<main>
  <div class="left">
    <table>
      <thead>
        <tr>
          <th></th>
          <th>Key</th><th>Icon</th><th>名字</th>
          <th class="num">金币</th><th class="num">刷新</th>
          <th class="num">回收率</th><th class="num">溢价</th>
          <th class="num">货物</th>
        </tr>
      </thead>
      <tbody id="listBody"></tbody>
    </table>
  </div>
  <div class="right" id="detail"></div>
</main>

<input type="file" id="importInput" accept=".json" hidden>
<datalist id="itemList"></datalist>

<script>
(function(){
'use strict';

/* =========================================================
   常量
   ========================================================= */
const LS_KEY = 'merchants_editor_skeleton_v1';

const BUY_OPTIONS = ['全部', '物品', '消耗品', '材料', '装备', '食材', '货币'];
const ENTRY_ORDER = [
  '_id','_name','_debugSample',
  'icon','desc','buys',
  'buyRate','markup','goldMax','refreshSec',
  'pool'
];

/* 默认骨架数据（8 位商人） */
function defaultData(){
  return [
    { key:'m1', _id:'m1', _name:'杂货商 老陈', _debugSample:true, icon:'🧺', desc:'日用百货，来者不拒',
      buys:['材料','消耗品','食材','物品'], buyRate:0.75, markup:1.4, goldMax:8000, refreshSec:7200,
      pool:[{itemId:'100001',qty:3},{itemId:'100012',qty:5},{itemId:'200001',qty:8},{itemId:'200002',qty:8},{itemId:'200003',qty:8},{itemId:'200008',qty:8}] },
    { key:'m2', _id:'m2', _name:'药剂师 白芷', _debugSample:true, icon:'⚗️', desc:'药水与草药，价格公道',
      buys:['材料','消耗品'], buyRate:0.9, markup:1.6, goldMax:15000, refreshSec:5400,
      pool:[{itemId:'100001',qty:6},{itemId:'100010',qty:5},{itemId:'100011',qty:3},{itemId:'200006',qty:10}] },
    { key:'m3', _id:'m3', _name:'铁匠 铁山', _debugSample:true, icon:'🔨', desc:'矿石与武器，重金收购',
      buys:['材料','装备'], buyRate:0.85, markup:1.5, goldMax:40000, refreshSec:10800,
      pool:[{itemId:'200004',qty:10},{itemId:'200005',qty:8},{itemId:'300702',qty:2},{itemId:'300102',qty:2},{itemId:'300402',qty:1},{itemId:'300502',qty:2}] },
    { key:'m4', _id:'m4', _name:'皮匠 皮特', _debugSample:true, icon:'🧵', desc:'皮革布料，装备买卖',
      buys:['材料','装备'], buyRate:0.8, markup:1.45, goldMax:20000, refreshSec:9000,
      pool:[{itemId:'200007',qty:10},{itemId:'200008',qty:10},{itemId:'300302',qty:2},{itemId:'300602',qty:2},{itemId:'300401',qty:2}] },
    { key:'m5', _id:'m5', _name:'流浪商人 卡西', _debugSample:true, icon:'🐫', desc:'什么都收，价格嘛……',
      buys:['全部'], buyRate:0.7, markup:1.2, goldMax:60000, refreshSec:14400,
      pool:[{itemId:'100001',qty:4},{itemId:'100010',qty:4},{itemId:'100012',qty:4},{itemId:'200004',qty:6},{itemId:'300704',qty:1},{itemId:'300705',qty:1},{itemId:'300706',qty:1},{itemId:'300303',qty:1}] },
    { key:'m6', _id:'m6', _name:'军需官 汉斯', _debugSample:true, icon:'🎖️', desc:'只收装备，出价极高',
      buys:['装备'], buyRate:0.95, markup:1.8, goldMax:120000, refreshSec:3600,
      pool:[{itemId:'300703',qty:1},{itemId:'300303',qty:1},{itemId:'300102',qty:2},{itemId:'300402',qty:2},{itemId:'300502',qty:2}] },
    { key:'m7', _id:'m7', _name:'厨子 胖叔', _debugSample:true, icon:'🍲', desc:'只对食材感兴趣',
      buys:['食材','消耗品'], buyRate:0.6, markup:1.3, goldMax:5000, refreshSec:2700,
      pool:[{itemId:'100012',qty:10},{itemId:'200003',qty:15},{itemId:'100001',qty:2}] },
    { key:'m8', _id:'m8', _name:'黑市 影', _debugSample:true, icon:'🕶️', desc:'不问来路，但钱袋有限',
      buys:['全部'], buyRate:1.1, markup:2.2, goldMax:30000, refreshSec:21600,
      pool:[{itemId:'300703',qty:1},{itemId:'300706',qty:1},{itemId:'100001',qty:5},{itemId:'100010',qty:5},{itemId:'300303',qty:1}] }
  ].map(o => normalizeEntry(o.key, o));
}

/* =========================================================
   数据模型
   ========================================================= */
function num(v, d){
  if (v === '' || v === null || v === undefined) return d;
  const n = Number(v);
  return isFinite(n) ? n : d;
}

function normPoolItem(p){
  if (!p || typeof p !== 'object') return null;
  const itemId = String(p.itemId == null ? '' : p.itemId).trim();
  if (!itemId) return null;
  return {
    itemId,
    qty: Math.max(1, Math.floor(num(p.qty, 1)))
  };
}

function normalizeEntry(key, obj){
  obj = obj || {};
  const pool = Array.isArray(obj.pool) ? obj.pool.map(normPoolItem).filter(Boolean) : [];
  const out = {
    key: String(key),
    _id:   obj._id   != null ? String(obj._id)   : String(key),
    _name: obj._name != null ? String(obj._name) : '',
    _debugSample: !!obj._debugSample,
    icon: obj.icon != null ? String(obj.icon) : '🏪',
    desc: obj.desc != null ? String(obj.desc) : '',
    buys: Array.isArray(obj.buys) ? obj.buys.map(String).filter(x => BUY_OPTIONS.includes(x)) : ['全部'],
    buyRate: Math.max(0, num(obj.buyRate, 0.75)),
    markup: Math.max(1, num(obj.markup, 1.5)),
    goldMax: Math.max(0, Math.floor(num(obj.goldMax, 10000))),
    refreshSec: Math.max(60, Math.floor(num(obj.refreshSec, 3600))),
    pool
  };
  Object.keys(obj).forEach(k => { if (!(k in out)) out[k] = obj[k]; });
  return out;
}

/* =========================================================
   状态
   ========================================================= */
let data = [];
let selectedKey = null;
let itemsRef = null;

const listBody    = document.getElementById('listBody');
const detail      = document.getElementById('detail');
const stat        = document.getElementById('stat');
const searchInput = document.getElementById('searchInput');
const itemsFile   = document.getElementById('itemsFile');
const itemsStatus = document.getElementById('itemsStatus');
const clearItemsBtn = document.getElementById('clearItemsBtn');
const itemList    = document.getElementById('itemList');

/* =========================================================
   工具
   ========================================================= */
function esc(s){
  return String(s === null || s === undefined ? '' : s)
    .replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function save(){
  try { localStorage.setItem(LS_KEY, JSON.stringify(data)); } catch(e){}
}
function currentItem(){
  return data.find(d => d.key === selectedKey) || null;
}

/* =========================================================
   items 参考表
   ========================================================= */
function hasItemsData(){ return itemsRef !== null; }
function itemsExists(id){ return !hasItemsData() || !!itemsRef[id]; }
function itemDisplayName(id){
  if (!hasItemsData()) return '';
  const it = itemsRef[id];
  if (!it) return '';
  return (it._props && it._props.Name) || it._name || id;
}

function applyItemsTable(raw){
  if (!raw || typeof raw !== 'object' || Array.isArray(raw)){
    alert('items.json 根节点必须是对象');
    return;
  }
  itemsRef = raw;
  const n = Object.keys(raw).length;
  itemsStatus.textContent = `已加载 ${n} 条 items`;
  itemsStatus.className = 'ok';
  clearItemsBtn.disabled = false;
  renderItemDatalist();
  renderList();
  renderDetail();
}

function clearItemsTable(){
  itemsRef = null;
  itemsStatus.textContent = '未加载';
  itemsStatus.className = 'hint';
  clearItemsBtn.disabled = true;
  renderItemDatalist();
  renderList();
  renderDetail();
}

function renderItemDatalist(){
  if (!hasItemsData()){ itemList.innerHTML = ''; return; }
  itemList.innerHTML = Object.keys(itemsRef).map(id => {
    const name = itemDisplayName(id);
    return `<option value="${esc(id)}">${esc(name)}</option>`;
  }).join('');
}

/* =========================================================
   筛选
   ========================================================= */
function visibleRows(){
  const q = searchInput.value.trim().toLowerCase();
  return data.filter(d => {
    if (q){
      const hay = [d.key, d._id, d._name].join(' ').toLowerCase();
      if (hay.indexOf(q) === -1) return false;
    }
    return true;
  });
}

/* =========================================================
   列表
   ========================================================= */
function renderList(){
  const rows = visibleRows();
  listBody.innerHTML = rows.map(d => {
    return `<tr data-key="${esc(d.key)}" draggable="true" class="${d.key===selectedKey?'selected':''}">
      <td class="drag">⠿</td>
      <td class="dim">${esc(d.key)}</td>
      <td>${esc(d.icon)}</td>
      <td>${esc(d._name || '')}</td>
      <td class="num">${d.goldMax}</td>
      <td class="num">${(d.refreshSec/60).toFixed(0)}m</td>
      <td class="num">${(d.buyRate*100).toFixed(0)}%</td>
      <td class="num">×${d.markup}</td>
      <td class="num">${d.pool.length}</td>
    </tr>`;
  }).join('');
  stat.textContent = `共 ${data.length} 位商人` +
    (rows.length !== data.length ? ` / 显示 ${rows.length}` : '');
}

/* =========================================================
   拖拽排序
   ========================================================= */
let dragKey = null;
let dropTarget = null;

function clearDropMarkers(){
  listBody.querySelectorAll('.drop-before,.drop-after').forEach(el => {
    el.classList.remove('drop-before','drop-after');
  });
}
function moveItem(srcKey, tgtKey, after){
  const si = data.findIndex(d => d.key === srcKey);
  if (si < 0) return;
  const item = data.splice(si,1)[0];
  let ti = data.findIndex(d => d.key === tgtKey);
  if (ti < 0){ data.splice(si,0,item); return; }
  if (after) ti += 1;
  data.splice(ti,0,item);
  save(); renderList();
}

listBody.addEventListener('dragstart', e => {
  const tr = e.target.closest('tr');
  if (!tr || !tr.dataset.key) return;
  dragKey = tr.dataset.key;
  tr.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
  try { e.dataTransfer.setData('text/plain', dragKey); } catch(_){}
});
listBody.addEventListener('dragover', e => {
  if (!dragKey) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  const tr = e.target.closest('tr');
  clearDropMarkers();
  if (!tr || !tr.dataset.key || tr.dataset.key === dragKey){ dropTarget = null; return; }
  const r = tr.getBoundingClientRect();
  const after = (e.clientY - r.top) > r.height/2;
  tr.classList.add(after ? 'drop-after' : 'drop-before');
  dropTarget = {key:tr.dataset.key, after};
});
listBody.addEventListener('drop', e => {
  if (!dragKey || !dropTarget) return;
  e.preventDefault();
  const src = dragKey;
  const t = dropTarget;
  dragKey = null; dropTarget = null;
  clearDropMarkers();
  moveItem(src, t.key, t.after);
});
listBody.addEventListener('dragend', () => {
  dragKey = null; dropTarget = null;
  clearDropMarkers();
  listBody.querySelectorAll('tr.dragging').forEach(el => el.classList.remove('dragging'));
});

/* =========================================================
   详情渲染
   ========================================================= */
function field(label, attr, val, opt){
  opt = opt || {};
  let ctrl;
  switch(opt.kind){
    case 'textarea':
      ctrl = `<textarea ${attr} rows="2">${esc(val)}</textarea>`;
      break;
    case 'number':
      ctrl = `<input type="number" step="${opt.step||'any'}" ${opt.min!==undefined?`min="${opt.min}"`:''} ${attr} value="${val===null||val===undefined?'':val}">`;
      break;
    default:
      ctrl = `<input type="text" ${attr} value="${esc(val)}">`;
  }
  return `<div class="field"><label>${label}</label>${ctrl}</div>`;
}

function boolHTML(attr, label, val){
  return `<label class="bool-item">
    <span>${label}</span>
    <input type="checkbox" ${attr} ${val?'checked':''}>
    <span class="track"></span>
  </label>`;
}

function renderPoolTable(item){
  const pool = item.pool || [];
  if (!pool.length){
    return `<div class="empty" style="padding:6px 2px">暂无货物。点击「＋ 添加货物」开始。</div>`;
  }
  const rows = pool.map((p, i) => {
    const miss = hasItemsData() && !itemsExists(p.itemId);
    const name = itemDisplayName(p.itemId);
    return `<tr data-pool-idx="${i}" class="${miss?'missing':''}">
      <td><input type="text" data-pool="itemId" data-idx="${i}" value="${esc(p.itemId)}" list="itemList"></td>
      <td class="name">${esc(name)}${miss?' ⚠':''}</td>
      <td><input type="number" data-pool="qty" data-idx="${i}" value="${p.qty}" min="1" step="1"></td>
      <td><button type="button" class="del" data-del-pool="${i}">删</button></td>
    </tr>`;
  }).join('');

  return `<table class="pool-table">
    <thead>
      <tr>
        <th style="width:35%">itemId</th>
        <th style="width:40%">物品名</th>
        <th style="width:15%">qty</th>
        <th style="width:10%"></th>
      </tr>
    </thead>
    <tbody>${rows}</tbody>
  </table>`;
}

function renderPoolCheck(item){
  if (!hasItemsData()){
    return `<div class="check-panel" id="poolCheck">
      <div class="row">未加载 items.json，跳过货物引用校验。点击顶部「加载 items.json」可校验 itemId 并显示物品名。</div>
    </div>`;
  }
  const pool = item.pool || [];
  if (!pool.length){
    return `<div class="check-panel" id="poolCheck">
      <div class="row">未配置货物。</div>
    </div>`;
  }
  const miss = pool.filter(p => !itemsExists(p.itemId)).map(p => p.itemId);
  const lines = [];
  lines.push(`<div class="row">共 <b>${pool.length}</b> 条货物配置。</div>`);
  if (miss.length){
    lines.push(`<div class="row err">缺失 itemId：${esc([...new Set(miss)].join(', '))}</div>`);
  } else {
    lines.push(`<div class="row ok">✓ 货物配置全部有效。</div>`);
  }
  return `<div class="check-panel" id="poolCheck">${lines.join('')}</div>`;
}

function renderDetail(){
  const item = currentItem();
  if (!item){
    detail.innerHTML = '<p class="hint">← 从左侧选择一位商人进行编辑</p>';
    return;
  }
  let h = '';

  h += '<div class="section-title">基本信息</div>';
  h += field('Key（对象键）', 'data-root="key"', item.key);
  h += '<div class="grid2">';
  h += field('_id（标识）', 'data-root="_id"', item._id);
  h += field('_name（名字）', 'data-root="_name"', item._name);
  h += '</div>';
  h += boolHTML('data-root="_debugSample"', '_debugSample（调试样例）', item._debugSample);
  h += '<div class="grid2">';
  h += field('Icon（图标）', 'data-root="icon"', item.icon);
  h += field('Desc（描述）', 'data-root="desc"', item.desc);
  h += '</div>';

  h += '<div class="section-title">交易设置</div>';
  h += '<div class="grid2">';
  h += field('BuyRate（回收率 0~1）', 'data-num="buyRate"', item.buyRate, {kind:'number', step:'0.01', min:'0'});
  h += field('Markup（售价倍率 ≥1）', 'data-num="markup"', item.markup, {kind:'number', step:'0.1', min:'1'});
  h += field('GoldMax（钱袋上限）', 'data-num="goldMax"', item.goldMax, {kind:'number', step:'100', min:'0'});
  h += field('RefreshSec（刷新秒）', 'data-num="refreshSec"', item.refreshSec, {kind:'number', step:'60', min:'60'});
  h += '</div>';

  h += '<div class="section-title">收购类型 buys</div>';
  h += '<div class="chk-grid">';
  BUY_OPTIONS.forEach(opt => {
    const on = item.buys.includes(opt);
    h += `<label class="chk"><input type="checkbox" data-buy="${opt}" ${on?'checked':''}> ${opt}</label>`;
  });
  h += '</div>';
  h += `<div class="tagline">如果勾选「全部」，将忽略其他具体类型。</div>`;

  h += '<div class="section-title">货物池 pool</div>';
  h += renderPoolTable(item);
  h += `<div class="drop-actions">
    <button type="button" class="mini" id="addPoolBtn">＋ 添加货物</button>
    <span class="tagline">qty 是每次刷新时的初始库存数量。</span>
  </div>`;
  h += renderPoolCheck(item);

  detail.innerHTML = h;

  /* 绑定 pool 增删 */
  const addBtn = document.getElementById('addPoolBtn');
  if (addBtn){
    addBtn.addEventListener('click', () => {
      item.pool.push({itemId:'', qty:1});
      save(); renderList(); renderDetail();
    });
  }
  detail.querySelectorAll('[data-del-pool]').forEach(btn => {
    btn.addEventListener('click', () => {
      const i = Number(btn.dataset.delPool);
      if (!isFinite(i) || i < 0 || i >= item.pool.length) return;
      item.pool.splice(i, 1);
      save(); renderList(); renderDetail();
    });
  });

  /* 绑定 pool 输入 */
  detail.querySelectorAll('[data-pool]').forEach(el => {
    el.addEventListener('input', onPoolEdit);
    el.addEventListener('change', onPoolEdit);
  });
}

function onPoolEdit(e){
  const el = e.target;
  const field = el.dataset.pool;
  if (!field) return;
  const item = currentItem();
  if (!item) return;
  const i = Number(el.dataset.idx);
  const p = item.pool[i];
  if (!p) return;

  if (field === 'itemId'){
    p.itemId = String(el.value).trim();
    if (e.type === 'change'){
      save(); renderList(); renderDetail();
    } else {
      save();
    }
    return;
  }

  if (field === 'qty'){
    let v = el.value === '' ? 1 : Number(el.value);
    if (!isFinite(v)) v = 1;
    p.qty = Math.max(1, Math.floor(v));
    save();
    const cp = document.getElementById('poolCheck');
    if (cp) cp.outerHTML = renderPoolCheck(item);
  }
}

/* =========================================================
   编辑事件
   ========================================================= */
function onEdit(e){
  const el = e.target;
  const item = currentItem();
  if (!item) return;

  if (el.dataset.root){
    const k = el.dataset.root;

    if (k === 'key'){
      if (e.type !== 'change') return;
      const nv = String(el.value).trim();
      if (!nv){ el.value = item.key; return; }
      if (nv === item.key) return;
      if (data.some(d => d !== item && d.key === nv)){
        alert('Key 已存在：' + nv);
        el.value = item.key;
        return;
      }
      item.key = nv;
      if (!item._id || item._id === selectedKey) item._id = nv;
      selectedKey = nv;
      renderList(); renderDetail(); save();
      return;
    }

    if (k === '_debugSample'){
      item._debugSample = el.checked;
      renderDetail(); renderList(); save();
      return;
    }

    item[k] = el.value;
    renderList(); save();
    return;
  }

  if (el.dataset.num){
    const k = el.dataset.num;
    let v = el.value === '' ? 0 : Number(el.value);
    if (!isFinite(v)) v = 0;
    if (k === 'buyRate') v = Math.max(0, v);
    if (k === 'markup') v = Math.max(1, v);
    if (k === 'goldMax') v = Math.max(0, Math.floor(v));
    if (k === 'refreshSec') v = Math.max(60, Math.floor(v));
    item[k] = v;
    renderList(); save();
    return;
  }

  if (el.dataset.buy){
    const opt = el.dataset.buy;
    if (el.checked){
      if (opt === '全部'){
        item.buys = ['全部'];
      } else {
        item.buys = item.buys.filter(x => x !== '全部');
        if (!item.buys.includes(opt)) item.buys.push(opt);
      }
    } else {
      item.buys = item.buys.filter(x => x !== opt);
      if (!item.buys.length) item.buys = ['全部'];
    }
    save(); renderDetail();
    return;
  }
}

detail.addEventListener('input',  onEdit);
detail.addEventListener('change', onEdit);

/* =========================================================
   列表交互
   ========================================================= */
listBody.addEventListener('click', e => {
  const tr = e.target.closest('tr');
  if (!tr || !tr.dataset.key) return;
  if (tr.dataset.key === selectedKey) return;
  selectedKey = tr.dataset.key;
  renderList(); renderDetail();
});

/* =========================================================
   新增 / 复制 / 删除
   ========================================================= */
function nextKey(){
  let max = 0;
  data.forEach(d => {
    const m = String(d.key).match(/^m(\d+)$/);
    if (m) max = Math.max(max, parseInt(m[1],10));
  });
  return 'm' + (max + 1);
}

document.getElementById('addBtn').onclick = () => {
  const key = nextKey();
  const it = normalizeEntry(key, {
    _id: key, _name: '新商人', _debugSample: false, icon:'🏪', desc:'',
    buys:['全部'], buyRate:0.75, markup:1.5, goldMax:10000, refreshSec:3600, pool:[]
  });
  data.push(it);
  selectedKey = it.key;
  renderList(); renderDetail(); save();
};

document.getElementById('dupBtn').onclick = () => {
  const src = currentItem();
  if (!src) return;
  const copy = JSON.parse(JSON.stringify(src));
  copy.key = nextKey();
  copy._id = copy.key;
  copy._name = (copy._name || '') + '_副本';
  copy._debugSample = false;
  data.push(copy);
  selectedKey = copy.key;
  renderList(); renderDetail(); save();
};

document.getElementById('delBtn').onclick = () => {
  if (!selectedKey) return;
  if (!confirm('确认删除 ' + selectedKey + ' ?')) return;
  const idx = data.findIndex(d => d.key === selectedKey);
  if (idx < 0) return;
  data.splice(idx,1);
  selectedKey = data.length ? data[Math.min(idx,data.length-1)].key : null;
  renderList(); renderDetail(); save();
};

/* =========================================================
   导入 / 导出
   ========================================================= */
document.getElementById('importBtn').onclick = () => {
  document.getElementById('importInput').click();
};

document.getElementById('importInput').onchange = e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try{
      const obj = JSON.parse(ev.target.result);
      if (Array.isArray(obj)){
        data = obj.map((x,i) => normalizeEntry(x.key != null ? x.key : ('m'+(i+1)), x));
      } else if (obj && typeof obj === 'object'){
        data = Object.keys(obj).map(k => normalizeEntry(k, obj[k]));
      } else {
        throw new Error('根节点必须是对象或数组');
      }
      selectedKey = data.length ? data[0].key : null;
      renderList(); renderDetail(); save();
    }catch(err){
      alert('导入失败：' + err.message);
    }
  };
  reader.readAsText(file);
  e.target.value = '';
};

/* items 参考加载 */
document.getElementById('loadItemsBtn').onclick = () => itemsFile.click();
itemsFile.addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try{ applyItemsTable(JSON.parse(ev.target.result)); }
    catch(err){
      alert('items.json 解析失败：' + err.message);
      itemsStatus.textContent = '加载失败';
      itemsStatus.className = 'miss';
    }
  };
  reader.readAsText(file);
  itemsFile.value = '';
});
clearItemsBtn.onclick = clearItemsTable;

document.getElementById('revalidateBtn').onclick = () => {
  renderList(); renderDetail();
};

function indentBlock(str, level){
  const pad = '  '.repeat(level);
  return str.split('\n').map((l,i) => i === 0 ? l : pad + l).join('\n');
}

function buildEntry(d){
  const out = {};
  ENTRY_ORDER.forEach(k => {
    if (k === '_debugSample'){
      if (d._debugSample) out[k] = true;
      return;
    }
    if (k === 'pool'){
      out[k] = (d.pool || []).map(p => ({itemId:p.itemId, qty:p.qty}));
      return;
    }
    if (d[k] !== undefined && d[k] !== null) out[k] = d[k];
  });
  Object.keys(d).forEach(k => {
    if (!(k in out) && k !== 'key' && k !== 'pool') out[k] = d[k];
  });
  return out;
}

function buildJSONText(){
  const parts = data.map(d => {
    return '  ' + JSON.stringify(d.key) + ': ' +
      indentBlock(JSON.stringify(buildEntry(d), null, 2), 1);
  });
  return '{\n' + parts.join(',\n') + '\n}';
}

document.getElementById('exportBtn').onclick = () => {
  const text = buildJSONText();
  const blob = new Blob([text], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'merchants.json';
  a.click();
  URL.revokeObjectURL(a.href);
};

/* =========================================================
   启动
   ========================================================= */
(function init(){
  const raw = localStorage.getItem(LS_KEY);
  if (raw){
    try{
      const parsed = JSON.parse(raw);
      data = Array.isArray(parsed)
        ? parsed.map(d => normalizeEntry(d.key, d))
        : defaultData();
    }catch(_){ data = defaultData(); }
  } else {
    data = defaultData();
  }
  if (!data.length) data = defaultData();
  selectedKey = data[0].key;
  renderList(); renderDetail();
})();

})();
</script>
