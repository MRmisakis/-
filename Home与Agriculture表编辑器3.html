<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Home / Agriculture 表编辑器</title>
<style>
  :root{--bg:#121212;--panel:#1A1A1A;--panel2:#202020;--line:#333;--text:#C8C8C8;--text-dim:#8A8A8A;--text-strong:#E8E8E8;--accent:#4A9EFF;--danger:#FF5A5A;--gain:#5FE0A0;--gold:#F0C040;--warn:#E8B14C}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:Consolas,"Courier New","PingFang SC","Microsoft YaHei",monospace;font-size:14px;height:100vh;display:flex;flex-direction:column;overflow:hidden}
  header{display:flex;gap:8px;align-items:center;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
  header h1{font-size:15px;margin:0 12px 0 0;color:var(--text-strong);font-weight:normal}
  button{background:var(--panel2);color:var(--text);border:1px solid var(--line);padding:5px 12px;cursor:pointer;font-family:inherit;font-size:13px}
  button:hover{border-color:var(--accent);color:var(--text-strong)}
  button.danger:hover{border-color:var(--danger);color:var(--danger)}
  button.tab.on{border-color:var(--gold);color:var(--gold)}
  input,select,textarea{background:#0E0E0E;color:var(--text-strong);border:1px solid var(--line);padding:5px 8px;font-family:inherit;font-size:13px;width:100%}
  input:focus,select:focus{outline:none;border-color:var(--accent)}
  input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
  #searchInput{width:170px}
  .stat{color:var(--text-dim);font-size:12px;margin-left:auto}
  main{flex:1;display:flex;min-height:0}
  .left{flex:1;min-width:0;overflow:auto;border-right:1px solid var(--line)}
  .right{width:600px;flex:none;overflow:auto;padding:14px;background:var(--panel)}
  table{width:100%;border-collapse:collapse}
  th,td{padding:6px 10px;text-align:left;border-bottom:1px solid #222;white-space:nowrap}
  th{position:sticky;top:0;background:var(--panel2);color:var(--text-dim);font-weight:normal;font-size:12px;z-index:1}
  tbody tr{cursor:pointer}
  tbody tr:hover{background:#1E1E1E}
  tbody tr.selected{background:#1A2A3A}
  .num{text-align:right}.dim{color:var(--text-dim)}.hint{color:var(--text-dim);text-align:center;padding:40px 0}
  .field{margin-bottom:9px}.field label{display:block;color:var(--text-dim);font-size:12px;margin-bottom:3px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 8px}
  .section-title{color:var(--accent);font-size:13px;margin:18px 0 10px;border-bottom:1px solid var(--line);padding-bottom:4px}
  .section-title:first-child{margin-top:0}
  .tagline{font-size:11px;color:var(--text-dim);margin-top:2px;line-height:1.5}
  .note{border-left:3px solid var(--warn);background:#1E1A12;padding:6px 9px;font-size:11px;color:#D6BE93;margin:8px 0;line-height:1.6}
  .card{background:#151925;border:1px solid #262e40;border-radius:6px;padding:8px;margin-bottom:8px}
  .card .hd{display:flex;gap:6px;align-items:center;margin-bottom:6px}
  .card .hd .t{flex:1;color:var(--text-strong)}
  .io-row{display:grid;grid-template-columns:1fr 70px 30px;gap:6px;align-items:center;margin-bottom:4px}
  .io-row button{padding:2px 6px}
  @media(max-width:900px){body{height:auto;min-height:100vh;overflow:auto}main{flex-direction:column}.left{border-right:none;border-bottom:1px solid var(--line);max-height:46vh}.right{width:auto;overflow:visible}.grid2,.grid3{grid-template-columns:1fr 1fr}#searchInput{width:130px}.stat{margin-left:0;width:100%}}
</style>
</head>
<body>
<header>
  <h1>Home / Agriculture 编辑器</h1>
  <button class="tab on" id="tabHome">home.json</button>
  <button class="tab" id="tabAgri">Agriculture.json</button>
  <button id="addBtn">＋ 新增</button>
  <button id="dupBtn">⧉ 复制</button>
  <button id="delBtn" class="danger">－ 删除</button>
  <button id="importBtn">导入 JSON</button>
  <button id="exportBtn">导出 JSON</button>
  <button id="loadItemsBtn">加载 items.json</button>
  <input type="text" id="searchInput" placeholder="搜索 id / 名字">
  <span class="stat" id="stat"></span>
</header>
<main>
  <div class="left"><table><thead id="thead"></thead><tbody id="listBody"></tbody></table></div>
  <div class="right" id="detail"></div>
</main>
<input type="file" id="importInput" accept=".json" hidden>
<input type="file" id="itemsInput" accept=".json" hidden>
<datalist id="itemList"></datalist>
<script>
(function(){
'use strict';
const LS_HOME='home_editor_v1', LS_AGRI='agri_editor_v1';
const STATIONS=[['workbench','工作台'],['forge','锻造机'],['blast','高炉'],['well','水井'],['rest','休息处']];
function defaultEff(){return {item:'',qty:1,sec:10,continuous:false,buff:20};}
function defaultHome(){return {
  workbench:{name:'工作台',loop:false,eff:defaultEff(),levels:[],recipes:[{id:'r1',out:'100001',qty:2,inputs:[{itemId:'200006',qty:1}],timeSec:5}]},
  forge:{name:'锻造机',loop:false,eff:defaultEff(),levels:[],recipes:[{id:'f1',out:'300001',qty:1,inputs:[{itemId:'200001',qty:3}],timeSec:10}]},
  blast:{name:'高炉',loop:false,eff:defaultEff(),levels:[],recipes:[{id:'b1',out:'300100',qty:1,inputs:[{itemId:'200001',qty:5}],timeSec:12}]},
  well:{name:'水井',loop:false,eff:defaultEff(),levels:[],recipes:[{id:'w1',out:'100010',qty:1,inputs:[{itemId:'200006',qty:1}],timeSec:6}]},
  rest:{name:'休息处',eff:defaultEff(),levels:[{pct:0.1,cost:[],timeSec:0},{pct:0.5,cost:[{itemId:'200001',qty:5}],timeSec:30}]}};}
function defaultAgri(){return {farm:{loop:false,eff:defaultEff(),levels:[]},crops:[{id:'c1',seed:'200006',out:'200006',qty:2,growSec:15,inputs:[],levels:[]},{id:'c2',seed:'200001',out:'200001',qty:2,growSec:20,inputs:[],levels:[]}]};}
function effEditor(cfg,scope){cfg=cfg||defaultEff();return '<div class="section-title">高效模式</div><div class="grid3">'
 +'<div class="field"><label>消耗物品</label><select data-e="item" data-es="'+scope+'">'+itemOptions(cfg.item)+'</select></div>'
 +'<div class="field"><label>数量 x</label><input type="number" data-e="qty" data-es="'+scope+'" value="'+(cfg.qty||1)+'"></div>'
 +'<div class="field"><label>持续 Xs</label><input type="number" data-e="sec" data-es="'+scope+'" value="'+(cfg.sec||10)+'"></div>'
 +'<div class="field"><label>buff %</label><input type="number" step="0.1" data-e="buff" data-es="'+scope+'" value="'+(cfg.buff||0)+'"></div>'
 +'</div><label class="chk"><input type="checkbox" data-e="continuous" data-es="'+scope+'" '+(cfg.continuous?'checked':'')+'> 持续消耗开关</label>';}
function levelsEditor(levels,scope,lvKind,delAttr){levels=levels||[];return '<div class="section-title">升级表 levels（等级/消耗/升级时间，仅编辑器，本体不显示）</div>'
 +levels.map((l,li)=>'<div class="card"><div class="hd"><span class="t">等级 '+(li+1)+'</span><button class="danger" data-'+delAttr+'="'+li+'">删</button></div>'
 +'<div class="grid2"><div class="field"><label>效果 %</label><input type="number" step="0.1" data-'+lvKind+'="pct" data-es="'+scope+'" data-li="'+li+'" value="'+(l.pct||0)+'"></div>'
 +'<div class="field"><label>升级时间 s</label><input type="number" data-'+lvKind+'="timeSec" data-es="'+scope+'" data-li="'+li+'" value="'+(l.timeSec||0)+'"></div></div>'
 +'<div class="tagline">升级消耗</div>'+costEditor(l.cost,scope+':'+li,'lc')+'</div>').join('')
 +'<button data-addlv="'+scope+'">＋ 等级</button>';}
function costEditor(list,scope,kind){list=list||[];return list.map((c,i)=>'<div class="io-row"><select data-'+kind+'="itemId" data-es="'+scope+'" data-ci="'+i+'">'+itemOptions(c.itemId)+'</select><input type="number" data-'+kind+'="qty" data-es="'+scope+'" data-ci="'+i+'" value="'+c.qty+'"><button class="danger" data-delcost="'+scope+','+i+'">×</button></div>').join('')+'<button data-addcost="'+scope+'">＋ 消耗</button>';}
let home=defaultHome(), agri=defaultAgri(), itemsRef=null;
let tab='home', selStation='workbench', selCrop=0;
const $=s=>document.querySelector(s);
const listBody=$('#listBody'), detail=$('#detail'), stat=$('#stat'), thead=$('#thead'), search=$('#searchInput');
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function save(){try{localStorage.setItem(LS_HOME,JSON.stringify(home));localStorage.setItem(LS_AGRI,JSON.stringify(agri));}catch(e){}}
function itemName(id){if(!itemsRef)return id;const it=itemsRef[id];return it?(it._props&&it._props.Name)||it._name||id:id;}
function num(v,d){const n=Number(v);return isFinite(n)?n:d;}
function itemOptions(cur){let h='<option value="">（选择物品）</option>';if(itemsRef)for(const id in itemsRef){h+='<option value="'+esc(id)+'"'+(id===cur?' selected':'')+'>'+esc(id+' '+itemName(id))+'</option>';}if(cur&&(!itemsRef||!itemsRef[cur]))h+='<option value="'+esc(cur)+'" selected>'+esc(cur)+'</option>';return h;}

function renderList(){
  const q=search.value.trim().toLowerCase();
  if(tab==='home'){
    thead.innerHTML='<tr><th>站点</th><th>名称</th><th class="num">配方数</th></tr>';
    listBody.innerHTML=STATIONS.map(([k,n])=>{
      const st=home[k]||{};const rc=(st.recipes||[]).length;
      if(q && !(k.includes(q)||(st.name||'').toLowerCase().includes(q)))return '';
      return '<tr data-st="'+k+'" class="'+(k===selStation?'selected':'')+'"><td>'+k+'</td><td>'+esc(st.name||n)+'</td><td class="num">'+(k==='rest'?'—':rc)+'</td></tr>';
    }).join('');
    listBody.querySelectorAll('tr').forEach(tr=>tr.addEventListener('click',()=>{selStation=tr.dataset.st;renderList();renderDetail();}));
    stat.textContent='home · 站点 '+STATIONS.length+' · 配方 '+STATIONS.reduce((s,[k])=>s+((home[k]&&home[k].recipes)||[]).length,0);
  } else {
    thead.innerHTML='<tr><th>id</th><th>种子</th><th>产出</th><th class="num">数量</th><th class="num">秒</th></tr>';
    listBody.innerHTML=(agri.crops||[]).map((c,i)=>{
      if(q && !(String(c.id).toLowerCase().includes(q)||itemName(c.seed).toLowerCase().includes(q)||itemName(c.out).toLowerCase().includes(q)))return '';
      return '<tr data-ci="'+i+'" class="'+(i===selCrop?'selected':'')+'"><td>'+esc(c.id)+'</td><td>'+esc(itemName(c.seed))+'</td><td>'+esc(itemName(c.out))+'</td><td class="num">'+c.qty+'</td><td class="num">'+c.growSec+'</td></tr>';
    }).join('');
    listBody.querySelectorAll('tr').forEach(tr=>tr.addEventListener('click',()=>{selCrop=+tr.dataset.ci;renderList();renderDetail();}));
    stat.textContent='Agriculture · 作物 '+(agri.crops||[]).length;
  }
}

function effObj(scope){ if(scope==='rest')return (home.rest=home.rest||{}).eff||(home.rest.eff=defaultEff());
  if(scope==='farm'){agri.farm=agri.farm||{loop:false,eff:defaultEff()};return agri.farm.eff||(agri.farm.eff=defaultEff());}
  if(scope.startsWith('st:')){const st=home[scope.slice(3)];return st.eff||(st.eff=defaultEff());} return defaultEff(); }
function costList(scope){ if(scope.startsWith('restlv:')){const l=home.rest.levels[+scope.slice(7)];return l.cost||(l.cost=[]);}
  if(scope.startsWith('stlv:')){const[st,i]=scope.slice(5).split(':');const l=(home[st].levels||[])[+i];return l.cost||(l.cost=[]);}
  if(scope.startsWith('farmlv:')){const l=(agri.farm.levels||[])[+scope.slice(7)];return l.cost||(l.cost=[]);}
  if(scope.startsWith('croplv:')){const l=(agri.crops[selCrop].levels=agri.crops[selCrop].levels||[])[+scope.slice(7)];return l.cost||(l.cost=[]);}
  if(scope.startsWith('crop:')){const c=agri.crops[+scope.slice(5)];return c.inputs||(c.inputs=[]);} return []; }
function renderDetail(){
  if(tab==='home'){
    const st=home[selStation]; if(!st){detail.innerHTML='<p class="hint">选择站点</p>';return;}
    let h='<div class="section-title">站点 · '+esc(selStation)+'</div>';
    h+='<div class="field"><label>名称</label><input data-sn value="'+esc(st.name||'')+'"></div>';
    if(selStation==='rest'){
      h+='<label class="chk"><input type="checkbox" data-restloop '+(st.loop?'checked':'')+'> 循环（休息处不适用）</label>';
      h+='<div class="section-title">升级表 levels（等级/消耗/升级时间，仅编辑器，本体不显示）</div>';
      h+=(st.levels||[]).map((l,li)=>'<div class="card"><div class="hd"><span class="t">等级 '+(li+1)+'</span><button class="danger" data-dellv="'+li+'">删</button></div>'
        +'<div class="grid2"><div class="field"><label>恢复 %MAX/1s</label><input type="number" step="0.1" data-lv="pct" data-li="'+li+'" value="'+l.pct+'"></div>'
        +'<div class="field"><label>升级时间 s</label><input type="number" data-lv="timeSec" data-li="'+li+'" value="'+l.timeSec+'"></div></div>'
        +'<div class="tagline">升级消耗</div>'+costEditor(l.cost,'restlv:'+li,'lc')+'</div>').join('');
      h+='<button id="addLv">＋ 等级</button>';
      h+=effEditor(st.eff,'rest');
    } else {
      h+='<label class="chk"><input type="checkbox" data-stloop '+(st.loop?'checked':'')+'> 循环制造开关</label>';
      h+=effEditor(st.eff,'st:'+selStation);
      h+=levelsEditor(st.levels,'stlv:'+selStation,'flv','delflv');
      h+='<div class="section-title">配方 recipes</div>';
      h+=(st.recipes||[]).map((r,ri)=>'<div class="card"><div class="hd"><span class="t">配方 '+(ri+1)+'</span><button class="danger" data-delrecipe="'+ri+'">删</button></div>'
        +'<div class="grid3"><div class="field"><label>id</label><input data-rf="id" data-ri="'+ri+'" value="'+esc(r.id)+'"></div>'
        +'<div class="field"><label>产出 out</label><select data-rf="out" data-ri="'+ri+'">'+itemOptions(r.out)+'</select></div>'
        +'<div class="field"><label>数量 qty</label><input type="number" data-rf="qty" data-ri="'+ri+'" value="'+r.qty+'"></div></div>'
        +'<div class="field"><label>制造时间 timeSec</label><input type="number" step="0.5" data-rf="timeSec" data-ri="'+ri+'" value="'+r.timeSec+'"></div>'
        +'<div class="tagline">消耗 inputs</div>'
        +(r.inputs||[]).map((inp,ii)=>'<div class="io-row"><select data-if="itemId" data-ri="'+ri+'" data-ii="'+ii+'">'+itemOptions(inp.itemId)+'</select><input type="number" data-if="qty" data-ri="'+ri+'" data-ii="'+ii+'" value="'+inp.qty+'"><button class="danger" data-delinput="'+ri+','+ii+'">×</button></div>').join('')
        +'<button data-addinput="'+ri+'">＋ 消耗</button></div>').join('');
      h+='<button id="addRecipe">＋ 配方</button>';
    }
    detail.innerHTML=h;
    const ar=$('#addRecipe');if(ar)ar.addEventListener('click',()=>{st.recipes=st.recipes||[];st.recipes.push({id:'r'+(st.recipes.length+1),out:'',qty:1,inputs:[],timeSec:5});save();renderList();renderDetail();});
    const al=$('#addLv');if(al)al.addEventListener('click',()=>{st.levels=st.levels||[];st.levels.push({pct:0.1,cost:[],timeSec:30});save();renderDetail();});
  } else {
    agri.farm=agri.farm||{loop:false,eff:defaultEff()};
    let h='<div class="section-title">农田全局</div><label class="chk"><input type="checkbox" data-floop '+(agri.farm.loop?'checked':'')+'> 循环种植开关</label>'+effEditor(agri.farm.eff,'farm')+levelsEditor(agri.farm.levels,'farmlv','fmlv','delfmlv');
    const c=(agri.crops||[])[selCrop];
    if(c){
      h+='<div class="section-title">作物 · '+esc(c.id)+'</div><div class="grid2">'
        +'<div class="field"><label>id</label><input data-cf="id" value="'+esc(c.id)+'"></div>'
        +'<div class="field"><label>种子 seed</label><select data-cf="seed">'+itemOptions(c.seed)+'</select></div>'
        +'<div class="field"><label>产出 out</label><select data-cf="out">'+itemOptions(c.out)+'</select></div>'
        +'<div class="field"><label>数量 qty</label><input type="number" data-cf="qty" value="'+c.qty+'"></div>'
        +'<div class="field"><label>生长秒 growSec</label><input type="number" data-cf="growSec" value="'+c.growSec+'"></div></div>';
      h+='<div class="tagline">种植消耗物品</div>'+costEditor(c.inputs,'crop:'+selCrop,'cin');
      h+='<div class="section-title">作物升级表（仅编辑器）</div>'+(c.levels||[]).map((l,li)=>'<div class="card"><div class="hd"><span class="t">等级 '+(li+1)+'</span><button class="danger" data-delclv="'+li+'">删</button></div><div class="field"><label>升级时间 s</label><input type="number" data-clv="timeSec" data-li="'+li+'" value="'+l.timeSec+'"></div>'+costEditor(l.cost,'croplv:'+li,'clc')+'</div>').join('')+'<button id="addClv">＋ 等级</button>';
    }
    detail.innerHTML=h;
    const ac=$('#addClv');if(ac)ac.addEventListener('click',()=>{c.levels=c.levels||[];c.levels.push({cost:[],timeSec:30});save();renderDetail();});
  }
}
detail.addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset.e){const o=effObj(el.dataset.es);const k=el.dataset.e;o[k]=(k==='qty'||k==='sec'||k==='buff')?num(el.value,0):(k==='continuous'?el.checked:el.value);save();return;}
  if(el.dataset.stloop!==undefined){home[selStation].loop=el.checked;save();renderList();return;}
  if(el.dataset.floop!==undefined){agri.farm.loop=el.checked;save();return;}
  if(el.dataset.lv){const l=home.rest.levels[+el.dataset.li];l[el.dataset.lv]=num(el.value,0);save();return;}
  if(el.dataset.flv){const st=home[el.dataset.es.slice(5)];const l=(st.levels||[])[+el.dataset.li];if(l){l[el.dataset.flv]=num(el.value,0);save();}return;}
  if(el.dataset.fmlv){const l=(agri.farm.levels||[])[+el.dataset.li];if(l){l[el.dataset.fmlv]=num(el.value,0);save();}return;}
  if(el.dataset.lc){const c=costList(el.dataset.es)[+el.dataset.ci];if(c){c[el.dataset.lc]=(el.dataset.lc==='qty')?num(el.value,0):el.value;save();}return;}
  if(el.dataset.clv){const l=agri.crops[selCrop].levels[+el.dataset.li];l[el.dataset.clv]=num(el.value,0);save();return;}
  if(el.dataset.clc){const l=agri.crops[selCrop].levels[+el.dataset.es.slice(7)];const c=l.cost[+el.dataset.ci];c[el.dataset.clc]=(el.dataset.clc==='qty')?num(el.value,0):el.value;save();return;}
  if(el.dataset.cin){const c=agri.crops[+el.dataset.es.slice(5)];const inp=c.inputs[+el.dataset.ci];inp[el.dataset.cin]=(el.dataset.cin==='qty')?num(el.value,0):el.value;save();return;}
  if(tab==='home'){
    const st=home[selStation];if(!st)return;
    if(el.dataset.sn!==undefined){st.name=el.value;save();renderList();return;}
    if(el.dataset.rf){const r=(st.recipes||[])[+el.dataset.ri];if(!r)return;const k=el.dataset.rf;r[k]=(k==='qty'||k==='timeSec')?num(el.value,0):el.value;save();renderList();return;}
    if(el.dataset.if){const r=(st.recipes||[])[+el.dataset.ri];const inp=r&&r.inputs[+el.dataset.ii];if(!inp)return;const k=el.dataset.if;inp[k]=(k==='qty')?num(el.value,0):el.value;save();return;}
  } else {
    const c=(agri.crops||[])[selCrop];if(!c)return;
    if(el.dataset.cf){const k=el.dataset.cf;c[k]=(k==='qty'||k==='growSec')?num(el.value,0):el.value;save();renderList();return;}
  }
});
detail.addEventListener('click',e=>{
  const st=home[selStation];
  const dc=e.target.closest('[data-delcost]');if(dc){const[scope,i]=dc.dataset.delcost.split(',');costList(scope).splice(+i,1);save();renderDetail();return;}
  const acst=e.target.closest('[data-addcost]');if(acst){costList(acst.dataset.addcost).push({itemId:'',qty:1});save();renderDetail();return;}
  const dl=e.target.closest('[data-dellv]');if(dl){home.rest.levels.splice(+dl.dataset.dellv,1);save();renderDetail();return;}
  const dfl=e.target.closest('[data-delflv]');if(dfl){const st=home[selStation];st.levels.splice(+dfl.dataset.delflv,1);save();renderDetail();return;}
  const dfm=e.target.closest('[data-delfmlv]');if(dfm){agri.farm.levels.splice(+dfm.dataset.delfmlv,1);save();renderDetail();return;}
  const alv=e.target.closest('[data-addlv]');if(alv){const sc=alv.dataset.addlv;let arr;if(sc.startsWith('stlv:')){const st=home[sc.slice(5)];arr=st.levels||(st.levels=[]);}else if(sc==='farmlv'){arr=agri.farm.levels||(agri.farm.levels=[]);}else if(sc.startsWith('restlv')){arr=home.rest.levels;}if(arr){arr.push({pct:0,cost:[],timeSec:30});save();renderDetail();}return;}
  const dcl=e.target.closest('[data-delclv]');if(dcl){agri.crops[selCrop].levels.splice(+dcl.dataset.delclv,1);save();renderDetail();return;}
  const dr=e.target.closest('[data-delrecipe]');if(dr&&tab==='home'){st.recipes.splice(+dr.dataset.delrecipe,1);save();renderList();renderDetail();return;}
  const ai=e.target.closest('[data-addinput]');if(ai&&tab==='home'){const r=st.recipes[+ai.dataset.addinput];r.inputs=r.inputs||[];r.inputs.push({itemId:'',qty:1});save();renderDetail();return;}
  const di=e.target.closest('[data-delinput]');if(di&&tab==='home'){const[ri,ii]=di.dataset.delinput.split(',').map(Number);st.recipes[ri].inputs.splice(ii,1);save();renderDetail();return;}
});
$('#tabHome').addEventListener('click',()=>{tab='home';$('#tabHome').classList.add('on');$('#tabAgri').classList.remove('on');renderList();renderDetail();});
$('#tabAgri').addEventListener('click',()=>{tab='agri';$('#tabAgri').classList.add('on');$('#tabHome').classList.remove('on');renderList();renderDetail();});
search.addEventListener('input',renderList);

$('#addBtn').addEventListener('click',()=>{
  if(tab==='home'){const st=home[selStation];if(selStation==='rest')return;st.recipes=st.recipes||[];st.recipes.push({id:'r'+(st.recipes.length+1),out:'',qty:1,inputs:[],timeSec:5});}
  else{agri.crops=agri.crops||[];agri.crops.push({id:'c'+(agri.crops.length+1),seed:'',out:'',qty:1,growSec:15});selCrop=agri.crops.length-1;}
  save();renderList();renderDetail();});
$('#dupBtn').addEventListener('click',()=>{
  if(tab==='home'){const st=home[selStation];if(selStation==='rest'||!st.recipes||!st.recipes.length)return;const last=st.recipes[st.recipes.length-1];st.recipes.push(JSON.parse(JSON.stringify(last)));}
  else{if(!agri.crops.length)return;agri.crops.push(JSON.parse(JSON.stringify(agri.crops[selCrop])));selCrop=agri.crops.length-1;}
  save();renderList();renderDetail();});
$('#delBtn').addEventListener('click',()=>{
  if(tab==='home'){const st=home[selStation];if(selStation==='rest'||!st.recipes||!st.recipes.length)return;st.recipes.pop();}
  else{if(!agri.crops.length)return;agri.crops.splice(selCrop,1);selCrop=Math.max(0,selCrop-1);}
  save();renderList();renderDetail();});

$('#importBtn').addEventListener('click',()=>$('#importInput').click());
$('#importInput').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const rd=new FileReader();
  rd.onload=ev=>{try{const o=JSON.parse(ev.target.result);
    if(tab==='home'){home=o.workbench?o:Object.assign(defaultHome(),o);}else{agri=o.crops?o:{crops:Array.isArray(o)?o:[]};}
    save();renderList();renderDetail();}catch(err){alert('导入失败：'+err.message);}};
  rd.readAsText(f);});
$('#exportBtn').addEventListener('click',()=>{
  const obj=tab==='home'?home:agri;const name=tab==='home'?'home.json':'Agriculture.json';
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}));a.download=name;a.click();URL.revokeObjectURL(a.href);});
$('#loadItemsBtn').addEventListener('click',()=>$('#itemsInput').click());
$('#itemsInput').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const rd=new FileReader();
  rd.onload=ev=>{try{itemsRef=JSON.parse(ev.target.result);$('#itemList').innerHTML=Object.keys(itemsRef).map(id=>'<option value="'+esc(id)+'">'+esc(itemName(id))+'</option>').join('');renderList();renderDetail();}catch(err){alert('items.json 解析失败');}};
  rd.readAsText(f);});

(function init(){
  try{const h=localStorage.getItem(LS_HOME);if(h)home=JSON.parse(h);const a=localStorage.getItem(LS_AGRI);if(a)agri=JSON.parse(a);}catch(e){}
  renderList();renderDetail();
})();
})();
</script>
</body>
</html>
